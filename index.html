<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Moléculas</title>
<meta name="description" content="Audiobook interativo sobre ligações químicas: ouça, observe e aprenda a montar moléculas passo a passo.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moléculas">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  /* fontes locais: o app abre com a tipografia certa mesmo sem internet */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 500 800; font-display: swap; src: url(fontes/bricolage-grotesque.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 400; font-display: swap; src: url(fontes/atkinson-hyperlegible-400.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 700; font-display: swap; src: url(fontes/atkinson-hyperlegible-700.woff2) format("woff2"); }

  :root {
    --celeste: #A3DBF7;
    --celeste-claro: #D3EFFC;
    --celeste-escuro: #6FC0EA;
    --preto: #0A1322;
    --grafite: #1B2A40;
    --branco: #FFFFFF;
    --ambar: #FFC24B;
    --ambar-claro: #FFD98A;
    --coral: #FF7A66;
    --anil: #7C9CFF;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --texto: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Identidade fixa nos dois temas: marinho profundo + celeste, com acentos quentes (âmbar e coral) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --celeste: #A3DBF7; --preto: #0A1322; }
  }
  :root[data-theme="dark"] { --celeste: #A3DBF7; --preto: #0A1322; }

  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--preto); }
  body {
    height: 100%;
    background: var(--preto);
    color: var(--branco);
    font-family: var(--texto);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;          /* sem zoom por duplo toque */
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  button:focus-visible { outline: 3px solid var(--celeste); outline-offset: 3px; }
  img, svg { max-width: 100%; }

  .tela { position: absolute; inset: 0; display: none; flex-direction: column; }
  .tela.ativa { display: flex; }

  /* ---------- CAPA (variação A: Esteira) ---------- */
  #capa {
    --pad-y: clamp(20px, 5vh, 56px); --pad-x: clamp(20px, 5vw, 80px);
    --cel: var(--celeste); --cel-d: var(--celeste-escuro); --cel-l: var(--celeste-claro);
    background:
      radial-gradient(60% 55% at 85% 20%, rgba(124,156,255,.16), transparent 70%),
      radial-gradient(45% 45% at 5% 100%, rgba(255,122,102,.12), transparent 70%),
      var(--preto);
    color: var(--branco);
    grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
    align-items: center; gap: clamp(16px, 4vw, 64px);
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 24px);
    overflow-x: hidden; overflow-y: auto;
  }
  #capa.ativa { display: grid; }
  /* logo acima do título; entra com o mesmo "pop" dos átomos */
  #capa .logo-capa { display: block; width: clamp(52px, 5vw + 24px, 84px); aspect-ratio: 300 / 412; height: auto; margin: 0 0 1.1rem; filter: drop-shadow(0 10px 24px rgba(124,156,255,.28)); }
  #capa.play .logo-capa { animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; transform-origin: 50% 80%; }
  @media (prefers-reduced-motion: reduce) { #capa.play .logo-capa { animation: none; } }
  #capa h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.7rem, 4.4vw + 1rem, 5.6rem); line-height: .92; letter-spacing: -.035em; margin: 0 0 .38em; }
  #capa h1 .l1 { display: block; font-weight: 500; letter-spacing: -.02em; }
  #capa h1 .l2 { display: block; color: var(--celeste); }
  #capa .lede { margin: 0 0 1.8rem; font-size: clamp(1.02rem, .5vw + .85rem, 1.25rem); line-height: 1.5; max-width: 31rem; }
  .btn-iniciar {
    display: inline-flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 32px 0 12px;
    border-radius: 999px; background: var(--ambar); color: var(--preto);
    font: 800 1.2rem/1 var(--display); letter-spacing: .01em;
    transition: transform .15s ease, background-color .15s ease;
  }
  .btn-iniciar .ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--preto); color: var(--ambar); }
  .btn-iniciar .ico svg { width: 14px; height: 14px; margin-left: 3px; }
  .btn-iniciar:hover { transform: translateY(-2px); background: var(--ambar-claro); }
  .btn-iniciar:active { transform: translateY(0); }
  .btn-iniciar:focus-visible { outline-color: var(--branco); outline-offset: 4px; }
  /* crédito do autor: retrato em "átomo" com anel celeste */
  #capa .credit { display: flex; align-items: center; gap: 14px; margin-top: 2.2rem; }
  /* versão publicada (atualizada automaticamente pelo publicar.ps1) */
  #capa .versao { position: absolute; right: var(--pad-x); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: .72rem; letter-spacing: .08em; color: #93A3BA; opacity: .75; font-variant-numeric: tabular-nums; }
  #capa .avatar {
    position: relative; flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
    background: var(--celeste-claro);
    box-shadow: 0 0 0 3px var(--preto), 0 0 0 5px var(--celeste), 0 0 0 11px rgba(163,219,247,.14);
  }
  /* recorte ampliado centrado no rosto, espelhado */
  #capa .avatar img { position: absolute; width: 180%; max-width: none; left: -18%; top: -21%; transform: scaleX(-1); }
  #capa .credit-txt { display: flex; flex-direction: column; gap: 2px; line-height: 1.15; }
  #capa .credit-txt small { font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ambar); }
  #capa .credit-txt strong { font-family: var(--display); font-weight: 800; font-size: 1.1rem; letter-spacing: -.01em; }

  #capa .art { display: block; width: 100%; height: auto; overflow: visible; max-height: calc(100dvh - 2 * var(--pad-y) - 24px); }
  .art .atom text { font-family: var(--display); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
  .art .bond { stroke-width: 5; stroke: var(--cel-l); }
  .art .arm { fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke: var(--ambar); }
  .art .arm-outer { fill: none; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; stroke: var(--preto); }
  .art .joint { stroke-width: 4; fill: var(--preto); stroke: var(--ambar); }
  .art .grip { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke: var(--ambar); }
  .art .gear, .art .roller { fill: none; stroke-width: 3; stroke-linejoin: round; stroke: var(--cel-d); }
  .art .rail { stroke-width: 6; stroke-linecap: round; }
  .art .rail, .art .leg, .art .floor { stroke: var(--cel-d); }
  .art .leg, .art .floor { stroke-width: 3; stroke-linecap: round; }
  .art .belt { fill: none; stroke-width: 3.5; stroke: var(--cel); }
  .art .belt-tex { stroke-width: 3; stroke-dasharray: 2 16; stroke-linecap: round; stroke: var(--cel-d); }
  .art .carriage { fill: var(--ambar); }
  .art .cap { font: 700 13px var(--texto); letter-spacing: .18em; text-transform: uppercase; text-anchor: middle; fill: #fff; opacity: .85; }
  .art .done { opacity: .9; }
  .art .stamp { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .14em; fill: var(--ambar); }
  .art .atom circle:first-child { stroke: var(--preto); stroke-width: 2.5; }
  .art .a-c circle:first-child { fill: var(--cel); }
  .art .a-o circle:first-child { fill: var(--coral); }
  .art .a-n circle:first-child { fill: var(--anil); }
  .art .a-h circle:first-child { fill: #fff; }
  .art .atom text { fill: var(--preto); }
  .art .shine { fill: #fff; opacity: .45; }

  /* animação única: átomos se conectando ao abrir a capa */
  #capa.play .pop { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d, 0s); }
  #capa.play .draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw .45s ease-out forwards; animation-delay: var(--d, 0s); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { #capa.play .pop, #capa.play .draw { animation: none; stroke-dashoffset: 0; } }

  /* fábrica em funcionamento: engrenagens engrenadas, roletes e lona da esteira */
  .art .g1 { transform-box: view-box; transform-origin: 528px 150px; animation: girar 14s linear infinite; }
  .art .g2 { transform-box: view-box; transform-origin: 612px 262px; animation: girar 7s linear infinite reverse; }
  .art .roller { transform-box: fill-box; transform-origin: center; animation: girar 1.6s linear infinite reverse; }
  .art .belt-tex { animation: esteira .5s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes esteira { to { stroke-dashoffset: 18; } }
  @media (prefers-reduced-motion: reduce) { .art .g1, .art .g2, .art .roller, .art .belt-tex { animation: none; } }

  /* retrato / celular */
  @media (max-aspect-ratio: 5/6), (max-width: 700px) {
    #capa { grid-template-columns: 1fr; align-content: center; gap: 12px; padding: calc(var(--pad-y) + 12px) var(--pad-x) var(--pad-y); }
    #capa .art { order: -1; max-height: 40dvh; }
    #capa .credit { margin-top: 26px; }
    .btn-iniciar { width: 100%; max-width: 420px; justify-content: center; padding: 0 24px 0 12px; }
    .btn-iniciar .ico { margin-right: auto; }
    .btn-iniciar .lbl { margin-right: auto; transform: translateX(-19px); }
  }

  /* ---------- PÁGINA 1 ---------- */
  #pagina1 { background: var(--preto); }
  .topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 32px);
    gap: 12px;
  }
  .marca {
    font-family: var(--display); font-weight: 800;
    color: var(--celeste); font-size: 1.1rem;
    display: flex; align-items: center; gap: .5em;
  }
  .marca svg { width: 25px; height: 34px; }
  .btn-home {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--celeste);
    font-size: .8rem; font-weight: 700;
    padding: 6px 10px; border-radius: 12px;
  }
  .btn-home svg { width: 28px; height: 28px; }
  .btn-home:hover { background: var(--grafite); }

  .palco {
    flex: 1; position: relative;
    margin: 0 clamp(12px, 3vw, 28px) 8px;
    border-radius: 24px;
    border: 2px solid var(--grafite);
    background-color: var(--preto);
    background-image: radial-gradient(circle, rgba(163,219,247,.16) 1.6px, transparent 1.8px);
    background-size: 28px 28px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  #conteudoPalco { position: absolute; inset: 0; }

  .faixa-player {
    position: absolute; z-index: 2;
    right: clamp(18px, 2.5vw, 28px); bottom: clamp(18px, 2.5vw, 28px);
  }

  .btn-play {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--ambar); color: var(--preto);
    display: grid; place-items: center;
    position: relative;
    transition: transform .15s ease;
  }
  .btn-play:hover { transform: scale(1.05); }
  .btn-play:active { transform: scale(.95); }
  .btn-play #iconePlay { width: 20px; height: 20px; }
  /* anel do tempo do áudio, em volta do botão */
  .btn-play .anel { position: absolute; inset: -7px; width: calc(100% + 14px); height: calc(100% + 14px); max-width: none; transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  .anel circle { fill: none; stroke-width: 5; }
  .anel-fundo { stroke: rgba(255,194,75,.18); }
  .anel-tempo { stroke: var(--ambar); stroke-linecap: round; stroke-dasharray: 100 100; stroke-dashoffset: 100; }

  /* ---------- CENAS DO PALCO ---------- */
  .art { --cel: var(--celeste); --cel-d: var(--celeste-escuro); --cel-l: var(--celeste-claro); }
  /* fábrica da capa rodando no palco enquanto a narração não começa */
  .palco .art { position: absolute; left: 2%; top: 3%; width: 96%; height: 94%; overflow: visible; }

  /* texto "digitado": cada letra já ocupa seu lugar e aparece na hora certa */
  .digita .ch { opacity: 0; }
  /* letras soltas (para digitar e desmoronar), agrupadas por palavra */
  .palavra { display: inline-block; white-space: nowrap; }
  .palavra .ch { display: inline-block; }
  .destaque { color: var(--ambar); font-weight: 800; text-shadow: 0 0 22px rgba(255,194,75,.45); }
  .fecha { color: #fff; font-weight: 500; text-shadow: none; }   /* aspas/ponto colados ao destaque, sem herdar a cor */

  /* narração 1 — definição */
  .c1-definicao, .c3-frase {
    position: absolute; left: 50%; top: 21%; transform: translate(-50%, 0); transform-origin: 50% 0;
    width: min(92%, 46ch); margin: 0; text-align: center;   /* 2 linhas em tela deitada: sobra espaço para a molécula */
    font-family: var(--display); font-weight: 500; line-height: 1.3; color: #fff;
    font-size: clamp(1.35rem, 3.4vmin + .7rem, 2.6rem); letter-spacing: -.01em;
  }

  /* narração 2 — molécula de água em 3D */
  .c2-cena { position: absolute; left: 0; right: 0; top: 33%; bottom: 13%; }   /* top e a posição da legenda são calculados no script */
  .c2-cena canvas { display: block; width: 100%; height: 100%; }
  .c2-legenda {
    position: absolute; left: 0; right: 0; top: 77%; margin: 0; text-align: center;
    font-family: var(--display); font-weight: 800; color: var(--ambar); line-height: 1.1;   /* nasce âmbar; vira celeste em 26,5s */
    font-size: clamp(1.3rem, 3vmin + .6rem, 2.3rem); letter-spacing: -.01em;
    text-shadow: 0 0 22px rgba(255,194,75,.45);
  }

  /* quebras de linha fixas que só valem no celular (ex.: definição em 4 linhas) */
  .quebra { display: none; }
  @media (max-aspect-ratio: 5/6), (max-width: 700px) {
    .quebra { display: block; }
    .c1-definicao, .c3-frase { width: 96%; font-size: clamp(1.1rem, 4.6vw, 1.6rem); }
  }

  /* narração 3 — cubo: a face 1 é a molécula + legenda; a face 2, o copo d'água */
  .c3-cubo { position: absolute; perspective: 1600px; z-index: 1; }
  .c3-giro { position: absolute; inset: 0; transform-style: preserve-3d; }
  .c3-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; border: 1px solid transparent; overflow: hidden; }
  .c3-f2 { background: #0a1322; border-color: rgba(163,219,247,.2); }
  .c3-f2 canvas { display: block; width: 100%; height: 100%; }
  /* dash e clarão ao "entrar na substância"; depois, o mundo quântico ocupa o palco (título e frase por cima) */
  .c0-titulo, .c3-frase { z-index: 3; pointer-events: none; }
  .c3-dash {
    position: absolute; left: 50%; top: 50%; width: 260%; aspect-ratio: 1; translate: -50% -50%; pointer-events: none; opacity: 0;
    background: repeating-conic-gradient(from 0deg, rgba(210,236,255,0) 0deg 5deg, rgba(210,236,255,.65) 5.5deg 6.2deg);
    -webkit-mask-image: radial-gradient(circle, transparent 12%, #000 30%, transparent 68%);
            mask-image: radial-gradient(circle, transparent 12%, #000 30%, transparent 68%);
  }
  .c3-flash { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 62%, #f2fbff 0%, rgba(163,219,247,.92) 38%, rgba(10,19,34,.35) 100%); }
  .c3-quantico { position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 75% at 50% 58%, #15315a 0%, #0c1a30 55%, #0a1322 100%); }
  .c3-quantico.ativo { pointer-events: auto; }

  /* narração 4 — fórmula química e quiz */
  .c4-formula {
    position: absolute; left: 0; right: 0; margin: 0; text-align: center; z-index: 3; pointer-events: none;
    font-family: var(--display); font-weight: 800; color: var(--celeste); line-height: 1.1;
    font-size: clamp(1.3rem, 3vmin + .6rem, 2.3rem); letter-spacing: -.01em; text-shadow: 0 0 22px rgba(163,219,247,.55);
  }
  .c4-opcoes {
    position: absolute; left: 50%; bottom: calc(clamp(18px, 2.5vw, 28px) + 58px); translate: -50% 0; z-index: 3;
    display: flex; gap: clamp(10px, 2.4vw, 18px);
  }
  .c4-op {
    min-width: clamp(84px, 20vw, 118px); padding: .5em 1em; border-radius: 16px;
    font: 800 clamp(1.35rem, 2.6vmin + .7rem, 2rem)/1 var(--display); color: #fff; letter-spacing: .01em;
    background: rgba(20,33,52,.88); border: 2px solid rgba(163,219,247,.35);
    box-shadow: 0 10px 28px rgba(0,0,0,.35); transition: border-color .2s, background-color .2s, transform .15s, opacity .4s;
  }
  .c4-op sub { font-size: .6em; vertical-align: -.25em; }
  .c4-op:hover { border-color: var(--celeste); transform: translateY(-2px); }
  .c4-op.errada { border-color: var(--coral); background: rgba(255,122,102,.22); }
  .c4-op.certa { border-color: #6EE7A0; background: rgba(110,231,160,.25); box-shadow: 0 0 0 4px rgba(110,231,160,.25), 0 0 30px rgba(110,231,160,.5); }
  .c4-opcoes.respondido .c4-op:not(.certa) { opacity: .25; pointer-events: none; }
  .c4-verde { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: 0; border-radius: inherit;
    background: radial-gradient(circle at 50% 55%, rgba(110,231,160,.5) 0%, rgba(110,231,160,.16) 55%, rgba(110,231,160,0) 80%);
    box-shadow: inset 0 0 90px rgba(110,231,160,.75); }
  .c4-confete { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; }

  /* narração 4R — de volta ao copo, lupa e fórmula */
  .c5-dash { width: 170%; z-index: 4; }
  .c5-copo { position: absolute; left: 0; right: 0; bottom: 3%; z-index: 1; opacity: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%); mask-image: linear-gradient(to bottom, transparent 0, #000 14%); }   /* sem borda reta no alto */
  .c5-copo canvas { display: block; width: 100%; height: 100%; }
  .c5-lupa {
    position: absolute; border-radius: 50%; overflow: visible; pointer-events: none;
    border: 3px solid rgba(225,238,250,.85);
    box-shadow: 0 0 0 1px rgba(10,19,34,.5), 0 8px 26px rgba(0,0,0,.45), inset 0 0 18px rgba(163,219,247,.35);
    background: radial-gradient(circle at 50% 50%, rgba(24,52,90,.92) 0%, rgba(14,34,62,.94) 70%, rgba(10,22,40,.96) 100%);
  }
  .c5-lupa canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
  .c5-lupa::before {        /* reflexo no vidro da lente */
    content: ""; position: absolute; inset: 6%; border-radius: 50%; z-index: 1;
    background: radial-gradient(ellipse 60% 38% at 32% 22%, rgba(255,255,255,.28), rgba(255,255,255,0) 70%);
  }
  .c5-lupa::after {         /* cabo, discreto */
    content: ""; position: absolute; width: 11%; height: 42%; left: 84%; top: 78%; border-radius: 6px;
    background: linear-gradient(90deg, #8fa3b8, #dfe9f3 45%, #7d8fa3); transform: rotate(-45deg); transform-origin: 50% 0;
    box-shadow: 0 4px 10px rgba(0,0,0,.4);
  }
  .c5-formula {
    position: absolute; margin: 0; z-index: 2; pointer-events: none; transform: translate(-50%, 0); white-space: nowrap;
    font-family: var(--display); font-weight: 800; color: #fff; line-height: 1;
    font-size: clamp(2rem, 5vmin + .8rem, 3.6rem); letter-spacing: .01em; text-shadow: 0 0 26px rgba(163,219,247,.6);
  }
  .c5-formula sub { font-size: .55em; vertical-align: -.2em; }
  .c3-quantico canvas { display: block; width: 100%; height: 100%; }

  /* narração 0 — boas-vindas */
  .c0-autor {
    position: absolute; left: 0; right: 0; top: 0; height: 64%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: clamp(12px, 2.6vh, 22px); padding: 0 16px; text-align: center;
  }
  .c0-foto {
    position: relative; width: clamp(96px, 20vmin, 170px); aspect-ratio: 1; flex-shrink: 0;
    border-radius: 50%; overflow: hidden; background: var(--celeste-claro); opacity: 0;
    box-shadow: 0 0 0 4px var(--preto), 0 0 0 7px var(--celeste), 0 0 0 18px rgba(163,219,247,.12);
  }
  .c0-foto img { position: absolute; width: 180%; max-width: none; left: -18%; top: -21%; transform: scaleX(-1); }
  .c0-credito { margin: 0; line-height: 1.2; min-height: 2.8em; }
  .c0-credito .l1 { display: block; font-size: clamp(.72rem, .8vmin + .5rem, .95rem); font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ambar); margin-bottom: .2em; }
  .c0-credito .l2 { display: block; font-family: var(--display); font-weight: 800; font-size: clamp(1.4rem, 3vmin + .7rem, 2.3rem); letter-spacing: -.01em; }
  .c0-titulo {
    position: absolute; left: 0; right: 0; top: 70%; margin: 0; text-align: center;
    font-family: var(--display); font-weight: 800; color: var(--celeste); line-height: 1;
    font-size: clamp(2.2rem, 6vmin + 1rem, 4.4rem); letter-spacing: -.03em;
  }
  .c0-corpo {
    position: absolute; left: 0; right: 0; top: 22%; bottom: 4%; padding: 0 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(10px, 2.4vh, 22px); text-align: center;
  }
  .c0-frase { margin: 0; font-family: var(--display); font-weight: 800; color: #fff; line-height: 1.1; font-size: calc(clamp(1.5rem, 3.6vmin + .8rem, 2.8rem) + 3px); letter-spacing: -.02em; }
  .c0-octeto { margin: 0; font-weight: 700; color: var(--ambar); font-size: calc(clamp(1.05rem, 2vmin + .6rem, 1.7rem) + 2px); letter-spacing: .02em; }
  .c0-lewis { margin: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; }
  .c0-lewis img {
    display: block; width: clamp(172px, 37.4vmin, 359px); aspect-ratio: 278 / 270; object-fit: cover;
    border-radius: 18px; filter: grayscale(1) contrast(1.05);
    box-shadow: 0 0 0 3px var(--grafite), 0 18px 50px rgba(0,0,0,.5);
  }
  .c0-lewis figcaption { margin-top: .7rem; font-size: calc(clamp(.85rem, 1vmin + .6rem, 1.05rem) + 2px); color: var(--celeste-claro); }
  .c0-lewis figcaption b { font-family: var(--display); font-weight: 800; color: #fff; }

  /* navegação rápida: aba discreta colada na base */
  .nav-rapida-barra {
    display: flex; justify-content: center;
    padding: 0 0 calc(4px + env(safe-area-inset-bottom, 0px));
  }
  .btn-nav-rapida {
    display: flex; align-items: center; gap: .4em;
    color: #93A3BA; opacity: .7;
    font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase;
    padding: 6px 16px; border-radius: 999px;
    transition: opacity .2s ease, color .2s ease, background-color .2s ease;
  }
  .btn-nav-rapida:hover, .btn-nav-rapida:focus-visible { opacity: 1; color: var(--celeste); background: var(--grafite); }
  .btn-nav-rapida svg { width: 14px; height: 14px; }

  /* ---------- SUMÁRIO (sobe de baixo) ---------- */
  .veu {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 10;
  }
  .veu.aberto { opacity: 1; pointer-events: auto; }
  .gaveta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 640px; margin: 0 auto;
    max-height: 75%;
    background: var(--celeste); color: var(--preto);
    border-radius: 26px 26px 0 0;
    padding: 10px 0 calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .gaveta.aberta { transform: translateY(0); }
  .alca { width: 44px; height: 5px; background: rgba(0,0,0,.35); border-radius: 3px; margin: 0 auto 8px; }
  .gaveta-topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 20px 12px;
  }
  .gaveta-topo h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
  .btn-fechar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--preto); color: var(--celeste);
    display: grid; place-items: center;
  }
  .btn-fechar svg { width: 20px; height: 20px; }
  .btn-fechar:focus-visible { outline-color: var(--preto); }
  .sumario { list-style: none; padding: 0 12px; overflow-y: auto; }
  .item-sumario {
    width: 100%; text-align: left;
    display: flex; align-items: center; gap: 14px;
    padding: 12px; border-radius: 16px;
    color: var(--preto);
  }
  .item-sumario:hover { background: rgba(255,255,255,.35); }
  .item-sumario:focus-visible { outline-color: var(--preto); }
  .item-sumario.atual { background: var(--preto); color: var(--celeste); }
  .num {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
    border: 3px solid currentColor;
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 1.05rem;
  }
  .item-texto { font-weight: 700; font-size: 1.05rem; line-height: 1.3; }

  @media (max-height: 560px) {
    .btn-play { width: 40px; height: 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gaveta, .veu { transition: none; }
  }

  /* ---------- TRANSIÇÃO EM CUBO entre capa e página ---------- */
  body { perspective: 1800px; }
  .tela { backface-visibility: hidden; }
  body.girando { pointer-events: none; }
  .cubo-sai        { transform-origin: 100% 50%; animation: cuboSai   .9s cubic-bezier(.65,0,.35,1) both; }
  .cubo-entra      { transform-origin:   0% 50%; animation: cuboEntra .9s cubic-bezier(.65,0,.35,1) both; }
  .cubo-sai-volta  { transform-origin:   0% 50%; animation: cuboSaiVolta   .9s cubic-bezier(.65,0,.35,1) both; }
  .cubo-entra-volta{ transform-origin: 100% 50%; animation: cuboEntraVolta .9s cubic-bezier(.65,0,.35,1) both; }
  @keyframes cuboSai        { to   { transform: translateX(-100%) rotateY(-90deg); filter: brightness(.35); } }
  @keyframes cuboEntra      { from { transform: translateX(100%)  rotateY(90deg);  filter: brightness(.35); } }
  @keyframes cuboSaiVolta   { to   { transform: translateX(100%)  rotateY(90deg);  filter: brightness(.35); } }
  @keyframes cuboEntraVolta { from { transform: translateX(-100%) rotateY(-90deg); filter: brightness(.35); } }
</style>

<script>
/* =========================================================

     Os eventos são presos ao ÁUDIO, não ao relógio: cada um
     dispara quando o áudio passa pelo seu tempo, e pausar o áudio
     congela as animações que estiverem rodando no palco.

const NARRACOES = [
  { id: "dialogo0", titulo: "Boas-vindas às Moléculas", src: "audio/audio_moleculas_0.mp3",
    inicio: p => p.mostrarFabrica(),
    eventos: [

      { tempo: 3.4,  acao: () => Cena0.foto() },           // foto do autor
      { tempo: 4,    acao: () => Cena0.credito() },        // "Desenvolvido por / Amauri Junior" (até 5s)
      { tempo: 8,    acao: () => Cena0.titulo() },         // "Moléculas" (1s)
      { tempo: 10,   acao: () => Cena0.pulsar() },         // "Moléculas" pulsa com brilho
      { tempo: 12,   acao: () => Cena0.subir() },          // tudo sobe e sai; o título fica no topo (até 13s)
      { tempo: 13.8, acao: () => Cena0.frase() },          // "Vamos construir moléculas"
      { tempo: 17.9, acao: () => Cena0.octeto() },         // "Teoria do octeto" (1s)

    ] },

    inicio: () => Cena0.montarFinal(),                     // parte da tela final da narração 0
    eventos: [
      { tempo: 2.6,  acao: () => Cena1.desmoronar() },     // tudo cai; fica só "Moléculas"
      { tempo: 4,    acao: () => Cena1.definicao() }       // digita a definição até 9.7s
    ] },
  { id: "dialogo2", titulo: "Ligações covalentes", src: "audio/audio_moleculas_2.mp3",
    inicio: () => Cena1.montarFinal(),                     // parte da tela final da narração 1
    eventos: [
      // A molécula 3D segue o tempo do áudio quadro a quadro (ver Cena2.quadro):
      //  6s entra girando · 10s três pulsos · 12s H maiores · 14s O maior · 16s ligações em destaque
      //  26,5s bastões transparentes com dois elétrons indo e voltando
      { tempo: 6,    acao: () => Cena2.entrar() },
      { tempo: 19,   acao: () => Cena2.legenda() },        // “Ligações covalentes” (1s), em âmbar
      { tempo: 26.5, acao: () => Cena2.legendaCeleste() }  // a legenda passa à cor dos elétrons (fade)
    ] },
  { id: "dialogo3", titulo: "A menor parte de uma substância", src: "audio/audio_moleculas_3.mp3",
    inicio: () => Cena2.montarFinal(),                     // parte da tela final da narração 2
    eventos: [
      { tempo: 1,    acao: () => Cena3.desmoronar() },     // a definição desmorona
      { tempo: 4,    acao: () => Cena3.frase() },          // "Representam a menor parte lógica..." (até 6,7s)
      { tempo: 7,    acao: () => Cena3.preparar() },       // monta o cubo e o copo com a tela parada (nada muda à vista)
      { tempo: 9.5,  acao: () => Cena3.cubo() },           // molécula + legenda viram a face de um cubo que gira: copo d'água
      // 11,2 → 16s: zoom na água (câmera do copo, presa ao tempo do áudio)
      { tempo: 16,   acao: () => Cena3.dash() },           // "dash": entrando na substância
      { tempo: 16.7, acao: () => Cena3.quantico() }        // moléculas de água no mundo quântico (tocáveis)

  { id: "dialogo4", titulo: "A fórmula da água", src: "audio/audio_moleculas_4.mp3",
    inicio: () => Cena3.montarFinal(),                     // parte do mundo quântico da narração 3

      { tempo: 6,    acao: () => Cena4.ficarUma() },       // somem em fade; a de cima vem para a frente
      { tempo: 16.6, acao: () => Cena4.atomosEmSequencia() }, // H, O, H crescem um de cada vez (até 18,7s)
      { tempo: 20.2, acao: () => Cena4.formula() },        // "Fórmula Química" digitada embaixo
      { tempo: 25.7, acao: () => Cena4.pulsar() },         // pulso com brilho na molécula
      { tempo: 27.6, acao: () => Cena4.hMaiores() },       // H maiores

      { tempo: 13,   acao: () => Cena4R.lupa() },          // lupa mágica mostrando as moléculas dentro do copo

];

/* ---------- Palco: área onde os eventos aparecem ---------- */
const Palco = {
  el: document.getElementById("conteudoPalco"),
  pausado: false,
  limpar() { this.el.innerHTML = ""; },
  mostrar(html) { this.el.innerHTML = html; this.sincronizar(); },
  adicionar(html) { this.el.insertAdjacentHTML("beforeend", html); this.sincronizar(); },
  reiniciar() { this.limpar(); this.pausado = false; },
  // Animações (CSS ou Web Animations) do palco seguem o estado do áudio.
  // Só as que estão rodando são pausadas: retomar uma animação já terminada a faria recomeçar.
  animacoes() { return this.el.getAnimations ? this.el.getAnimations({ subtree: true }) : []; },
  pausar() { this.pausado = true; this.animacoes().forEach(a => { if (a.playState === "running") a.pause(); }); },
  retomar() { this.pausado = false; this.animacoes().forEach(a => { if (a.playState === "paused") a.play(); }); },
  sincronizar() { if (this.pausado) this.pausar(); },

  // Anima um elemento e já respeita a pausa (segundos → milissegundos ficam aqui)
  animar(el, quadros, { duracao = 1, atraso = 0, easing = "ease", fill = "both" } = {}) {
    const a = el.animate(quadros, { duration: duracao * 1000, delay: atraso * 1000, easing, fill });
    if (this.pausado) a.pause();
    return a;
  },

  // Escreve o texto em letras soltas (span.ch), agrupadas por palavra para quebrar linha só entre palavras.
  // partes: "texto" ou [{ classe, texto, junto }, ...] (cada parte com classe vira um span: linha, destaque...)
  // junto: true gruda o começo da parte na palavra anterior (pontuação, aspas) para não quebrar linha ali
  letras(el, partes) {
    if (typeof partes === "string") partes = [{ texto: partes }];
    const novo = (tag, className, textContent = "") => Object.assign(document.createElement(tag), { className, textContent });
    el.textContent = "";
    const letras = [];
    let palavra = null;
    partes.forEach(({ classe, texto, junto, quebra }) => {
      if (quebra) { el.appendChild(novo("span", "quebra")); palavra = null; return; }   // quebra de linha só no celular (CSS)
      let bloco = null;
      const noBloco = () => bloco ??= (classe ? el.appendChild(novo("span", classe)) : el);
      if (!junto) palavra = null;
      for (const trecho of texto.split(/(\s+)/)) {
        if (!trecho) continue;
        if (/^\s+$/.test(trecho)) { palavra = null; letras.push(noBloco().appendChild(novo("span", "ch esp", " "))); continue; }
        let destino;
        if (palavra) destino = classe ? palavra.appendChild(novo("span", classe)) : palavra;
        else destino = palavra = noBloco().appendChild(novo("span", "palavra"));
        for (const c of trecho) letras.push(destino.appendChild(novo("span", "ch", c)));
      }
    });
    return letras;
  },

  // Digita letra a letra em "duracao" segundos
  digitar(el, partes, duracao = 1) {
    el.classList.add("digita");
    const letras = this.letras(el, partes);
    const passo = duracao / letras.length;
    letras.forEach((s, i) => this.animar(s, [{ opacity: 0 }, { opacity: 1 }], { duracao: .04, atraso: i * passo, easing: "linear" }));
  },

  // Desmorona: cada peça balança, despenca girando e sai por baixo do palco
  desmoronar(pecas, { duracao = 1.2, espalhar = .4 } = {}) {
    const base = this.el.getBoundingClientRect();
    return pecas.map(p => {
      const r = p.getBoundingClientRect();
      const queda = base.bottom - r.top + 60;
      const giro = (Math.random() - .5) * 140, deriva = (Math.random() - .5) * 90;
      return this.animar(p, [
        { transform: "translate(0px, 0px) rotate(0deg)" },
        { transform: `translate(${deriva * .05}px, -5px) rotate(${giro * .06}deg)`, offset: .15 },
        { transform: `translate(${deriva}px, ${queda}px) rotate(${giro}deg)` }
      ], { duracao: duracao * (.75 + Math.random() * .25), atraso: Math.random() * espalhar, easing: "cubic-bezier(.45,0,.9,.45)" });
    });
  },

  // A fábrica da capa, rodando no palco
  mostrarFabrica() {
    const svg = document.querySelector("#capa .art").cloneNode(true);
    svg.removeAttribute("role"); svg.removeAttribute("aria-label"); svg.setAttribute("aria-hidden", "true");
    svg.querySelector("#arcA").id = "arcPalco";                     // evita id repetido na página
    svg.querySelector("textPath").setAttribute("href", "#arcPalco");
    this.el.replaceChildren(svg);
    this.sincronizar();
  },

  // Desmonta a fábrica peça por peça: cada uma se solta, gira e voa para fora do palco
  desmontarFabrica(duracao = 1) {
    const svg = this.el.querySelector(".art");
    if (!svg) return;
    const pecas = [...svg.children].sort(() => Math.random() - .5);
    const vb = svg.viewBox.baseVal, cx = vb.x + vb.width / 2, cy = vb.y + vb.height / 2;
    const voo = duracao / 2, passo = (duracao - voo) / pecas.length;
    const anims = pecas.map((p, i) => {
      const b = p.getBBox();
      const ang = Math.atan2(b.y + b.height / 2 - cy, b.x + b.width / 2 - cx) + (Math.random() - .5) * .8;
      const dist = 700 + Math.random() * 300, giro = (Math.random() - .5) * 540;
      if (!p.matches(".g1, .g2")) { p.style.transformBox = "fill-box"; p.style.transformOrigin = "center"; }
      return this.animar(p, [
        { translate: "0px 0px", rotate: "0deg", opacity: 1 },
        { translate: `${Math.cos(ang) * 8}px ${Math.sin(ang) * 8 - 6}px`, rotate: `${giro > 0 ? 10 : -10}deg`, opacity: 1, offset: .22 },
        { translate: `${Math.cos(ang) * dist}px ${Math.sin(ang) * dist}px`, rotate: `${giro}deg`, opacity: 0 }
      ], { duracao: voo, atraso: i * passo, easing: "cubic-bezier(.5,0,.85,.4)" });
    });
    Promise.all(anims.map(a => a.finished)).then(() => svg.remove(), () => {});
  }
};

/* ---------- Cenas da narração 0: boas-vindas ---------- */
const Cena0 = {

/* ---------- Cenas da narração 2: a molécula de água (3D) ---------- */
// Tudo na molécula é função do tempo do áudio: pausar o áudio congela a cena no mesmo quadro.
const Cena2 = {
  $(sel) { return Palco.el.querySelector(sel); },
  CORES: { O: 0xFF0D0D, H: 0xFFFFFF, ligacao: 0xC8C8C8, destaque: 0xFFC24B, eletron: 0xA3DBF7 },   // CPK/Jmol

  entrar() {
    // a definição fica como está; a molécula ocupa o espaço abaixo dela (ver ajustar, em montar3D)
    Palco.adicionar(`<div class="c2-cena" aria-label="Molécula de água: um oxigênio ligado a dois hidrogênios"></div><p class="c2-legenda"></p>`);
    this.montar3D(this.$(".c2-cena"));
  },

  legenda() {
    Palco.digitar(this.$(".c2-legenda"), [
      { texto: "“Ligações covalentes”" }
    ], 1);
  },
  legendaCeleste() {
    Palco.animar(this.$(".c2-legenda"), [
      { color: "#FFC24B", textShadow: "0 0 22px rgba(255,194,75,.45)" },
      { color: "#A3DBF7", textShadow: "0 0 22px rgba(163,219,247,.55)" }
    ], { duracao: .6, easing: "ease-in-out" });
  },

  // Tela final da narração 2 (para quem pula direto para a narração seguinte)
  montarFinal() {
    if (this.$(".c2-cena")) return;
    Cena1.montarFinal();
    Palco.adicionar(`<div class="c2-cena" aria-label="Molécula de água: um oxigênio ligado a dois hidrogênios"></div><p class="c2-legenda"></p>`);
    const leg = this.$(".c2-legenda");
    Palco.letras(leg, "“Ligações covalentes”");
    Object.assign(leg.style, { color: "#A3DBF7", textShadow: "0 0 22px rgba(163,219,247,.55)" });
    this.montar3D(this.$(".c2-cena"), 28);
  },

  montar3D(caixa, tInicial = 6) {
    if (!window.THREE || !caixa) return;
    // cores em hex são sRGB (as cores CPK saem fiéis, sem desbotar)
    if ("legacyMode" in THREE.ColorManagement) THREE.ColorManagement.legacyMode = false; else THREE.ColorManagement.enabled = true;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { console.warn("sem WebGL", e); return; }
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    caixa.appendChild(renderer.domElement);

    const cena = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(28, 1, .1, 100);
    cena.add(new THREE.HemisphereLight(0xdfefff, 0x1b2a40, .75));
    const chave = new THREE.DirectionalLight(0xffffff, 1.25); chave.position.set(3, 4, 6); cena.add(chave);
    const recorte = new THREE.DirectionalLight(0xA3DBF7, .55); recorte.position.set(-5, -2, -4); cena.add(recorte);

    // geometria da água: ângulo H–O–H de 104,5°
    const rO = .62, rH = .34;
    const L = rO + rH + .68 * .8, meio = (104.5 / 2) * Math.PI / 180;
    const pos = { O: new THREE.Vector3(0, 0, 0),
                  H1: new THREE.Vector3(-L * Math.sin(meio), -L * Math.cos(meio), 0),
                  H2: new THREE.Vector3( L * Math.sin(meio), -L * Math.cos(meio), 0) };
    const centro = pos.O.clone().add(pos.H1).add(pos.H2).divideScalar(3);
    Object.values(pos).forEach(v => v.sub(centro));

    const molecula = new THREE.Group(); cena.add(molecula);
    const material = cor => new THREE.MeshPhysicalMaterial({ color: cor, roughness: .3, metalness: 0, clearcoat: .7, clearcoatRoughness: .18, transparent: true, opacity: 0 });
    const esfera = new THREE.SphereGeometry(1, 64, 48);

    // halo (brilho) de cada átomo: sprite com gradiente radial, mistura aditiva
    const tela = document.createElement("canvas"); tela.width = tela.height = 128;
    const g = tela.getContext("2d"), grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, "rgba(255,255,255,1)"); grad.addColorStop(.35, "rgba(255,255,255,.45)"); grad.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
    const texHalo = new THREE.CanvasTexture(tela);
    const halo = (cor, escala) => {
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: texHalo, color: cor, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
      s.scale.setScalar(escala); return s;
    };

    const atomo = (nome, raio, cor) => {
      const m = new THREE.Mesh(esfera, material(cor)); m.position.copy(pos[nome]); m.userData.raio = raio; m.scale.setScalar(raio);
      const h = halo(nome === "O" ? 0xff8a7a : 0xdff3ff, raio * 4.2); h.position.copy(pos[nome]);
      molecula.add(m, h); return { m, h };
    };
    const O = atomo("O", rO, this.CORES.O), H1 = atomo("H1", rH, this.CORES.H), H2 = atomo("H2", rH, this.CORES.H);

    // bastões (cilindros) do O até cada H
    const bastao = (de, para, raioDe, raioPara) => {
      const dir = para.clone().sub(de), comp = dir.length();
      // trecho visível do bastão (fora das esferas): os elétrons andam nele
      const ini = raioDe / comp + .04, fim = 1 - raioPara / comp - .04;
      const mat = new THREE.MeshPhysicalMaterial({ color: this.CORES.ligacao, roughness: .35, clearcoat: .5, transparent: true, opacity: 0, emissive: this.CORES.destaque, emissiveIntensity: 0 });
      const c = new THREE.Mesh(new THREE.CylinderGeometry(.13, .13, comp, 32, 1, true), mat);
      c.position.copy(de.clone().add(para).multiplyScalar(.5));
      c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
      molecula.add(c);
      // dois elétrons por ligação, que vão das pontas ao centro e voltam
      const eletrons = [0, 1].map(() => {
        const e = new THREE.Mesh(new THREE.SphereGeometry(.075, 24, 16), new THREE.MeshBasicMaterial({ color: this.CORES.eletron, transparent: true, opacity: 0 }));
        const eh = halo(this.CORES.eletron, .55);
        molecula.add(e, eh); return { e, eh };
      });
      return { c, de, para, eletrons, ini, fim, meio: (ini + fim) / 2 };
    };
    const ligacoes = [bastao(pos.O, pos.H1, rO, rH), bastao(pos.O, pos.H2, rO, rH)];

    // enquadramento: a molécula inteira cabe com folga, em qualquer proporção
    // Layout: a caixa 3D começa logo abaixo da definição, e a legenda logo abaixo do ponto mais baixo da molécula
    const def = Palco.el.querySelector(".c1-definicao"), legenda = Palco.el.querySelector(".c2-legenda");
    const baixo = new THREE.Vector3(0, pos.H1.y - rH, 0);
    const ajustar = () => {
      if (def && !caixa.dataset.fixo) caixa.style.top = `${def.offsetTop + def.offsetHeight + 10}px`;   // "fixo": já está na face do cubo
      const w = caixa.clientWidth || 1, h = caixa.clientHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      camera.position.set(0, 0, Math.max(2.9 / .9 / 2 / t, 4 / .9 / 2 / (t * camera.aspect)));   // molécula 10% menor
      camera.updateProjectionMatrix();
      if (legenda) legenda.style.top = `${caixa.offsetTop + (1 - baixo.clone().project(camera).y) / 2 * h + 12}px`;
    };
    const obs = new ResizeObserver(ajustar); [caixa, def, Palco.el].forEach(e => e && obs.observe(e)); ajustar();

    // relógio da cena: segue o áudio da narração 2; depois do fim continua (elétrons em movimento), e congela na pausa
    let t = tInicial, antes = performance.now();
    const cor = new THREE.Color(), cinza = new THREE.Color(this.CORES.ligacao), preto = new THREE.Color(0x000000);
    const suave = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
    const rampa = (t0, d) => suave((t - t0) / d);

    const quadro = () => {
      if (!renderer.domElement.isConnected) { obs.disconnect(); renderer.dispose(); return; }
      const agora = performance.now(), dt = (agora - antes) / 1000; antes = agora;
      if (Player.indice === 2 && Player.fonte && !Player.terminou) t = Player.fonte.currentTime;
      else if (!Palco.pausado) t += dt;

      // entrada: fade in terminando um giro e parando de frente
      const vis = rampa(6, .8);
      molecula.rotation.y = -(1 - (1 - Math.pow(1 - Math.min(Math.max((t - 6) / 1.6, 0), 1), 3))) * Math.PI * 2.5;
      // 3 pulsos com brilho (10s → 11,8s)
      const p = t >= 10 && t < 11.8 ? Math.pow(Math.sin(Math.PI * ((t - 10) / .6)), 2) : 0;
      molecula.scale.setScalar(1 + .08 * p);
      // H maiores (12→14), O maior (14→16)
      const sH = 1 + .35 * (rampa(12, .4) - rampa(14, .4));
      const sO = 1 + .3 * (rampa(14, .4) - rampa(16, .4));
      O.m.scale.setScalar(O.m.userData.raio * sO);
      [H1, H2].forEach(a => a.m.scale.setScalar(a.m.userData.raio * sH));
      [O, H1, H2].forEach(a => { a.m.material.opacity = vis; a.h.material.opacity = .85 * p; });
      // ligações em destaque (16s) e transparentes com elétrons (23s)
      const dest = rampa(16, .5), transp = rampa(26.5, .6), ele = rampa(26.8, .4);
      // em destaque, o corpo do bastão apaga e a cor vem só do emissivo: sai exatamente o âmbar do texto (#FFC24B)
      cor.copy(cinza).lerp(preto, dest);
      const fase = (1 - Math.cos(2 * Math.PI * Math.max(t - 26.8, 0) / 1.4)) / 2;   // 0 → 1 → 0
      ligacoes.forEach(l => {
        l.c.material.color.copy(cor);
        l.c.material.emissiveIntensity = dest;
        l.c.material.specularIntensity = 1 - .9 * dest;
        l.c.material.opacity = vis * (1 - .78 * transp);
        l.c.material.depthWrite = transp < .5;
        l.eletrons.forEach((el, i) => {
          const ponta = i === 0 ? l.ini : l.fim;
          const u = ponta + (l.meio - ponta) * fase;                         // cada um sai de uma ponta até o centro e volta
          el.e.position.copy(l.de).lerp(l.para, u); el.eh.position.copy(el.e.position);
          el.e.material.opacity = ele; el.eh.material.opacity = .9 * ele;
        });
      });
      renderer.render(cena, camera);
      requestAnimationFrame(quadro);
    };
    requestAnimationFrame(quadro);
  }
};

/* ---------- Cenas da narração 3: a menor parte de uma substância ---------- */
const Cena3 = {
  $(sel) { return Palco.el.querySelector(sel); },
  // a definição desmorona (o elemento fica, vazio, para a molécula não sair do lugar)
  desmoronar() {
    Palco.desmoronar([...Palco.el.querySelectorAll(".c1-definicao .ch:not(.esp)")], { duracao: 1.2, espalhar: .45 });
  },
  frase() {
    Palco.adicionar(`<p class="c3-frase"></p>`);
    Palco.digitar(this.$(".c3-frase"), "Representam a menor parte lógica de uma substância", 2.7);
  },

  // Molécula + legenda viram a face da frente de um cubo; o copo d'água fica pronto na face seguinte.
  // Montado antes do giro (tela parada): criar o vidro 3D pesa um instante e não pode atrasar o giro.
  preparar() {
    const caixa = this.$(".c2-cena"), leg = this.$(".c2-legenda");
    if (!caixa || !leg || this.$(".c3-cubo")) return;
    const P = Palco.el, topo = caixa.offsetTop, H = caixa.offsetHeight;
    const faixa = document.createRange(); faixa.selectNodeContents(leg);
    const larguraTexto = faixa.getBoundingClientRect().width;
    // largura ≥ 1,45 × altura: o enquadramento 3D continua limitado pela altura e a molécula não muda de tamanho
    const W = Math.round(Math.min(P.clientWidth, Math.max(H * 1.45, larguraTexto + 40)));
    Palco.adicionar(`
      <div class="c3-cubo"><div class="c3-giro">
        <div class="c3-face c3-f1"></div>
        <div class="c3-face c3-f2" aria-label="Um copo com água"></div>
      </div></div>`);
    const cubo = this.$(".c3-cubo"), giro = this.$(".c3-giro"), f1 = this.$(".c3-f1"), f2 = this.$(".c3-f2");
    Object.assign(cubo.style, { left: `${(P.clientWidth - W) / 2}px`, top: `${topo}px`, width: `${W}px`, height: `${H}px` });
    f1.style.transform = `translateZ(${W / 2}px)`;
    f2.style.transform = `rotateY(90deg) translateZ(${W / 2}px)`;

    // leva molécula e legenda para a face 1 sem mudar nada do que está na tela
    const legTopo = leg.offsetTop - topo;
    caixa.dataset.fixo = "1";
    f1.append(caixa, leg);
    Object.assign(caixa.style, { top: "0px", bottom: "auto", height: `${H}px` });
    leg.style.top = `${legTopo}px`;

    giro.style.transform = `translateZ(${-W / 2}px)`;
    this.W = W;
    Copo.montar(f2);
    this.prepararQuantico();
  },

  // o mundo quântico já nasce montado (invisível), para não travar o zoom nem o dash
  prepararQuantico() {
    if (this.$(".c3-quantico")) return;
    Palco.adicionar(`<div class="c3-quantico" aria-label="Moléculas de água no mundo quântico: toque nelas"></div>`);
    this.quantum = Quantico.montar(this.$(".c3-quantico"));
  },

  // 16s: "dash" — linhas de velocidade explodem do copo e um clarão cobre a tela (pico em 16,7s)
  dash() {
    const cubo = this.$(".c3-cubo");
    if (!cubo) return;
    cubo.insertAdjacentHTML("beforeend", `<div class="c3-dash"></div>`);
    Palco.adicionar(`<div class="c3-flash"></div>`);
    Palco.animar(this.$(".c3-dash"), [
      { opacity: 0, transform: "scale(.35) rotate(0deg)" },
      { opacity: 1, transform: "scale(1.3) rotate(8deg)", offset: .6 },
      { opacity: 0, transform: "scale(3) rotate(14deg)" }
    ], { duracao: .8, easing: "cubic-bezier(.5,0,.9,.6)" });
    Palco.animar(this.$(".c3-flash"), [{ opacity: 0 }, { opacity: 0, offset: .3 }, { opacity: 1, offset: .58 }, { opacity: 0 }],
      { duracao: 1.2, easing: "ease-in-out" });
  },

  // 16,7s: sob o clarão, surge o mundo quântico; as cenas antigas (cubo) são descartadas
  quantico() {
    if (!this.$(".c3-quantico")) this.prepararQuantico();
    const q = this.$(".c3-quantico");
    q.classList.add("ativo");
    this.textosSubstancia();                   // troca feita sob o clarão: ao clarear, a tela já fala de substância
    if (this.quantum) this.quantum.visivel = true;
    const cubo = this.$(".c3-cubo");
    Palco.animar(q, [{ opacity: 0 }, { opacity: 1 }], { duracao: .25 }).finished.then(() => cubo && cubo.remove(), () => {});
  },

  // tela final da narração 3 (para quem pula direto para a narração seguinte)
  montarFinal() {
    if (this.$(".c3-quantico.ativo")) return;
    Palco.mostrar(`<h2 class="c0-titulo" style="top:5%"></h2><p class="c3-frase"></p><div class="c3-quantico ativo" style="opacity:1"></div>`);
    this.textosSubstancia();
    this.quantum = Quantico.montar(this.$(".c3-quantico"), { revelar: true });
  },

  // dentro da substância: novo título e nova definição, nos mesmos lugares
  textosSubstancia() {
    const titulo = this.$(".c0-titulo"), frase = this.$(".c3-frase");
    if (titulo) { titulo.classList.remove("digita"); Palco.letras(titulo, "Substância"); }
    if (frase) { frase.classList.remove("digita"); Palco.letras(frase, "É formada por aglomerados de moléculas idênticas"); }
  },

  // gira o cubo: a molécula sai pela esquerda e o copo entra
  cubo() {
    if (!this.$(".c3-cubo")) this.preparar();
    const giro = this.$(".c3-giro"), f1 = this.$(".c3-f1"), f2 = this.$(".c3-f2");
    if (!giro) return;
    const z = `translateZ(${-this.W / 2}px)`, easing = "cubic-bezier(.65,0,.35,1)";
    Palco.animar(f1, [{ backgroundColor: "rgba(20,33,52,0)", borderColor: "rgba(163,219,247,0)" },
                      { backgroundColor: "rgba(20,33,52,.92)", borderColor: "rgba(163,219,247,.2)" }], { duracao: .3 });
    Palco.animar(giro, [{ transform: `${z} rotateY(0deg)` }, { transform: `${z} rotateY(-90deg)` }], { duracao: 1.2, atraso: .3, easing });
    Palco.animar(f1, [{ filter: "brightness(1)" }, { filter: "brightness(.35)" }], { duracao: 1.2, atraso: .3, easing });
    Palco.animar(f2, [{ filter: "brightness(.35)" }, { filter: "brightness(1)" }], { duracao: 1.2, atraso: .3, easing });
  }
};

/* ---------- Copo d'água 3D (vidro e água com refração real, luz de estúdio) ---------- */
const Copo = {
  // ambiente de estúdio: sala escura com softboxes; gera os reflexos e o que o vidro refrata
  estudio(renderer) {
    const env = new THREE.Scene();
    env.add(new THREE.Mesh(new THREE.BoxGeometry(14, 9, 14), new THREE.MeshBasicMaterial({ color: 0x101a2a, side: THREE.BackSide })));
    const painel = (w, h, cor, forca, x, y, z) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(cor).multiplyScalar(forca), side: THREE.DoubleSide }));
      m.position.set(x, y, z); m.lookAt(0, 1, 0); env.add(m);
    };
    painel(7, 1.4, 0xffffff, 7, 0, 4.4, 0);       // teto
    painel(1.6, 6, 0xffffff, 5, -6.8, 1, 2);      // lateral esquerda
    painel(1.6, 6, 0xdff2ff, 4, 6.8, 1, -1.5);    // lateral direita
    painel(5, 2.2, 0xA3DBF7, 1.6, 0, 1.2, -6.8);  // fundo, celeste
    const pm = new THREE.PMREMGenerator(renderer), tex = pm.fromScene(env, .02).texture;
    pm.dispose(); return tex;
  },

  // fundo de estúdio: degradê marinho com duas faixas verticais de luz suave
  fundoEstudio() {
    const c = document.createElement("canvas"); c.width = 1024; c.height = 704;
    const g = c.getContext("2d");
    const base = g.createRadialGradient(512, 300, 40, 512, 360, 620);
    base.addColorStop(0, "#2d4a70"); base.addColorStop(1, "#0a1322");
    g.fillStyle = base; g.fillRect(0, 0, 1024, 704);
    [[330, 60, .22], [700, 40, .16]].forEach(([x, w, a]) => {
      const f = g.createLinearGradient(x - w, 0, x + w, 0);
      f.addColorStop(0, "rgba(210,236,255,0)"); f.addColorStop(.5, `rgba(210,236,255,${a})`); f.addColorStop(1, "rgba(210,236,255,0)");
      g.fillStyle = f; g.fillRect(x - w, 0, 2 * w, 704);
    });
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  },

  // textura de gradiente radial (fundo e sombra)
  gradiente(interna, externa) {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const g = c.getContext("2d"), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    gr.addColorStop(0, interna); gr.addColorStop(1, externa);
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; return t;
  },

  // roteiro (opcional): { indice, montar(ctx), posicionar(t, ctx) } — a câmera e extras seguem o áudio daquela narração.
  // Sem roteiro: o da narração 3 (zoom na água e mergulho).
  montar(caixa, roteiro = null) {
    if (!window.THREE || !caixa) return null;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { console.warn("sem WebGL", e); return null; }
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    caixa.appendChild(renderer.domElement);

    const cena = new THREE.Scene();
    cena.environment = this.estudio(renderer);
    const alvo = new THREE.Vector3(0, 1.25, 0);
    const camera = new THREE.PerspectiveCamera(28, 1, .1, 100);
    const luz = new THREE.DirectionalLight(0xffffff, 1.4); luz.position.set(-3, 6, 4); cena.add(luz);

    // fundo de estúdio atrás do copo, com faixas de luz: é ele que a água desvia (refração visível)
    const fundo = new THREE.Mesh(new THREE.PlaneGeometry(26, 16), new THREE.MeshBasicMaterial({ map: this.fundoEstudio() }));
    fundo.position.set(0, 3, -3.2); cena.add(fundo);
    // piso escuro e sombra de contato
    const piso = new THREE.Mesh(new THREE.PlaneGeometry(40, 30), new THREE.MeshStandardMaterial({ color: 0x0c1524, roughness: .55, metalness: 0 }));
    piso.rotation.x = -Math.PI / 2; cena.add(piso);
    const copo = new THREE.Group(); cena.add(copo);           // vidro + água + sombra: pode ser deslocado de lado
    const sombra = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4), new THREE.MeshBasicMaterial({ map: this.gradiente("rgba(0,0,0,.75)", "rgba(0,0,0,0)"), transparent: true, depthWrite: false }));
    sombra.rotation.x = -Math.PI / 2; sombra.position.y = .003; copo.add(sombra);

    // perfil do copo (raio, altura): fundo grosso, parede fina, borda arredondada, levemente cônico
    const v = (x, y) => new THREE.Vector2(x, y);
    const parede = y => .885 + (y - .24) * (.15 / 2.46);      // raio interno da parede na altura y
    const perfilVidro = [v(0, 0), v(.86, 0), v(.905, .012), v(.925, .05), v(1.08, 2.69), v(1.078, 2.712), v(1.062, 2.722),
                         v(1.046, 2.714), v(1.035, 2.695), v(.885, .24), v(.86, .222), v(0, .21)];
    // Vidro: parede fina quase não refrata; o que se vê é reflexo (forte nas bordas, efeito Fresnel).
    // Por isso ele só SOMA luz por cima da cena (preto + reflexos, mistura aditiva). Assim a água,
    // que é a parte refrativa, continua visível — no three.js um objeto refrativo não enxerga outro.
    const vidro = new THREE.Mesh(new THREE.LatheGeometry(perfilVidro, 160), new THREE.MeshPhysicalMaterial({
      color: 0x000000, metalness: 0, roughness: .015, clearcoat: 1, clearcoatRoughness: .02,
      specularIntensity: 1, envMapIntensity: 2.2, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, side: THREE.DoubleSide
    }));
    vidro.renderOrder = 2;
    copo.add(vidro);

    // água: acompanha a parede interna, com menisco na borda; refrata o fundo (índice 1,333)
    const nivel = 1.95, rN = parede(nivel) - .004;
    const perfilAgua = [v(0, .214), v(.855, .226), v(parede(.3) - .004, .3), v(rN, nivel - .02), v(rN - .012, nivel - .004), v(rN - .05, nivel - .012), v(0, nivel - .012)];
    const agua = new THREE.Mesh(new THREE.LatheGeometry(perfilAgua, 160), new THREE.MeshPhysicalMaterial({
      color: 0xffffff, metalness: 0, roughness: 0, transmission: 1, thickness: 2, ior: 1.333,
      attenuationColor: new THREE.Color(0xd2ecfb), attenuationDistance: 7, specularIntensity: .8, envMapIntensity: .9
    }));
    copo.add(agua);

    if (roteiro) return this.comRoteiro(caixa, renderer, { cena, camera, copo }, roteiro);

    // Câmera presa ao tempo do áudio da narração 3:
    //  até 11,2s parada · 11,2 → 16s aproxima-se da água · 16 → 16,7s mergulha através do vidro ("dash")
    let dist0 = 8, ultimoT = -1, mudou = true;
    const suave = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
    const acelera = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * x;
    const alvoAgua = new THREE.Vector3(0, 1.08, 0), mira = new THREE.Vector3();
    const posicionar = t => {
      const z = suave((t - 11.2) / 4.8), d = acelera((t - 16) / .7);
      const dist = THREE.MathUtils.lerp(dist0, 1.75, z) + (0 - 1.75) * d;        // no dash atravessa a parede
      mira.copy(alvo).lerp(alvoAgua, z);
      camera.fov = 28 + 34 * d;                                                  // campo de visão abre: sensação de velocidade
      camera.position.set(0, mira.y + dist * .3 * (1 - z * .85), dist);
      camera.lookAt(mira); camera.updateProjectionMatrix();
    };
    const ajustar = () => {
      const w = caixa.clientWidth || 1, h = caixa.clientHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.fov = 28;
      const tg = Math.tan(THREE.MathUtils.degToRad(14));
      dist0 = Math.max(3.6 / 2 / tg, 3.4 / 2 / (tg * camera.aspect));
      mudou = true;
    };
    const obs = new ResizeObserver(ajustar); obs.observe(caixa); ajustar();
    const quadro = () => {
      if (!renderer.domElement.isConnected) { obs.disconnect(); renderer.dispose(); return; }
      const t = Player.indice === 3 && Player.fonte ? Player.fonte.currentTime : Math.max(ultimoT, 0);
      if (t !== ultimoT || mudou) { posicionar(t); renderer.render(cena, camera); ultimoT = t; mudou = false; }
      requestAnimationFrame(quadro);
    };
    requestAnimationFrame(quadro);
    posicionar(0); renderer.render(cena, camera);   // já compila os shaders na montagem (tela parada)
    return null;
  },

  // Laço genérico: a cada quadro, o roteiro posiciona câmera e extras no tempo do áudio da sua narração
  comRoteiro(caixa, renderer, ctx, roteiro) {
    Object.assign(ctx, { caixa, THREE });
    ctx.naTela = v => { const p = v.clone().project(ctx.camera); return { x: (p.x + 1) / 2 * caixa.clientWidth, y: (1 - p.y) / 2 * caixa.clientHeight }; };
    let ultimoT = -1, mudou = true;
    const ajustar = () => {
      const w = caixa.clientWidth || 1, h = caixa.clientHeight || 1;
      renderer.setSize(w, h, false); ctx.camera.aspect = w / h;
      if (roteiro.ajustar) roteiro.ajustar(ctx);
      mudou = true;
    };
    if (roteiro.montar) roteiro.montar(ctx);
    const obs = new ResizeObserver(ajustar); obs.observe(caixa); ajustar();
    const quadro = () => {
      if (!renderer.domElement.isConnected) { obs.disconnect(); renderer.dispose(); return; }
      const t = Player.indice === roteiro.indice && Player.fonte ? Player.fonte.currentTime : Math.max(ultimoT, 0);
      if (t !== ultimoT || mudou) { roteiro.posicionar(t, ctx); renderer.render(ctx.cena, ctx.camera); ultimoT = t; mudou = false; }
      requestAnimationFrame(quadro);
    };
    roteiro.posicionar(0, ctx); renderer.render(ctx.cena, ctx.camera);   // compila na montagem
    requestAnimationFrame(quadro);
    return ctx;
  }
};

/* ---------- Mundo quântico: moléculas de água flutuando, que respondem ao toque ---------- */
const Quantico = {
  CORES: { O: 0xFF0D0D, H: 0xFFFFFF, ligacao: 0xC8C8C8, nuvem: 0xA3DBF7 },

  textura(paradas) {
    const c = document.createElement("canvas"); c.width = c.height = 128;
    const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    paradas.forEach(([p, cor]) => gr.addColorStop(p, cor));
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  },

  // uma molécula de água (mesmo modelo da narração 2) com nuvem eletrônica difusa
  agua(mats, geo) {
    const grupo = new THREE.Group(), rO = .62, rH = .34, L = rO + rH + .68 * .8, meio = (104.5 / 2) * Math.PI / 180;
    const pH = [new THREE.Vector3(-L * Math.sin(meio), -L * Math.cos(meio), 0), new THREE.Vector3(L * Math.sin(meio), -L * Math.cos(meio), 0)];
    const centro = pH[0].clone().add(pH[1]).divideScalar(3);
    // materiais próprios de cada molécula: permitem apagar, fazer brilhar etc. uma só
    const mO = mats.O.clone(), mH = mats.H.clone(), mL = mats.ligacao.clone();
    [mO, mH, mL].forEach(x => { x.transparent = true; x.emissive = x.color.clone(); x.emissiveIntensity = 0; });
    const O = new THREE.Mesh(geo.esfera, mO); O.scale.setScalar(rO); O.position.copy(centro).negate();
    grupo.add(O);
    const Hs = pH.map(p => { const h = new THREE.Mesh(geo.esfera, mH); h.scale.setScalar(rH); h.position.copy(p).sub(centro); grupo.add(h); return h; });
    const bastoes = Hs.map(h => {
      const b = new THREE.Mesh(geo.bastao, mL); grupo.add(b); return b;
    });
    const nuvem = new THREE.Sprite(mats.nuvem.clone()); nuvem.scale.setScalar(4.2); grupo.add(nuvem);
    const alvos = [O, ...Hs, ...bastoes];
    // est: variáveis que o roteiro do áudio anima (tamanho dos átomos, opacidade, símbolos, destaque)
    const est = { escalaO: 1, escalaH: 1, h0: 1, h1: 1, opac: 1, rotH: 0, rotO: 0, mov: 0, fixa: false, pulso: 0 };   // h0/h1: escala de cada H
    grupo.userData = { O, Hs, bastoes, nuvem, alvos, rO, rH, mats: [mO, mH, mL], est, baseH: Hs.map(h => h.position.clone()) };
    this.alinharBastoes(grupo.userData);
    return grupo;
  },
  // bastão do O até cada H, acompanhando a posição dos átomos
  alinharBastoes({ O, Hs, bastoes }) {
    const y = new THREE.Vector3(0, 1, 0);
    bastoes.forEach((b, i) => {
      const dir = Hs[i].position.clone().sub(O.position), comp = dir.length();
      b.position.copy(O.position).add(Hs[i].position).multiplyScalar(.5);
      b.scale.set(1, comp, 1);
      b.quaternion.setFromUnitVectors(y, dir.normalize());
    });
  },

  // reações ao toque (p vai de 0 a 1 ao longo da ação)
  ACOES: {
    giro:      { dur: 1,   f: (m, p, a) => m.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(a.eixo, Math.PI * 2 * (p * p * (3 - 2 * p)))) },
    sacudida:  { dur: .7,  f: (m, p, a) => m.position.addScaledVector(a.dir, Math.sin(p * Math.PI * 12) * .22 * (1 - p)) },
    vaiVem:    { dur: 1.2, f: (m, p, a) => m.position.addScaledVector(a.dir, Math.sin(p * Math.PI * 2) * 1.1) },
    pulo:      { dur: .8,  f: (m, p) => m.scale.multiplyScalar(1 + .45 * Math.sin(p * Math.PI)) },
    brilho:    { dur: 1,   f: (m, p) => { m.userData.nuvem.material.opacity += .7 * Math.sin(p * Math.PI); } },
    vibracao:  { dur: 1.2, f: (m, p) => { const u = m.userData, k = 1 + .28 * Math.sin(p * Math.PI * 8) * (1 - p); u.Hs.forEach((h, i) => h.position.copy(u.baseH[i]).sub(u.O.position).multiplyScalar(k).add(u.O.position)); } }
  },

  montar(caixa, { revelar = false } = {}) {
    if (!window.THREE || !caixa) return null;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { console.warn("sem WebGL", e); return null; }
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.domElement.style.touchAction = "none";
    caixa.appendChild(renderer.domElement);

    const cena = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, .1, 100); camera.position.set(0, 0, 14);
    cena.add(new THREE.HemisphereLight(0xdfefff, 0x1b2a40, .8));
    const chave = new THREE.DirectionalLight(0xffffff, 1.2); chave.position.set(3, 5, 7); cena.add(chave);
    const recorte = new THREE.DirectionalLight(0xA3DBF7, .6); recorte.position.set(-6, -3, -4); cena.add(recorte);

    const mat = cor => new THREE.MeshPhysicalMaterial({ color: cor, roughness: .3, clearcoat: .7, clearcoatRoughness: .18 });
    const mats = {
      O: mat(this.CORES.O), H: mat(this.CORES.H), ligacao: mat(this.CORES.ligacao),
      nuvem: new THREE.SpriteMaterial({ map: this.textura([[0, "rgba(163,219,247,.55)"], [.45, "rgba(163,219,247,.14)"], [1, "rgba(163,219,247,0)"]]),
                                         transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: .35 })
    };
    const geo = { esfera: new THREE.SphereGeometry(1, 48, 32), bastao: new THREE.CylinderGeometry(.13, .13, 1, 24, 1, true) };

    // poeira quântica: pontinhos de "probabilidade" que cintilam no fundo
    const nPts = 700, pts = new Float32Array(nPts * 3);
    for (let i = 0; i < nPts; i++) pts.set([(Math.random() - .5) * 34, (Math.random() - .5) * 22, -12 + Math.random() * 16], i * 3);
    const gp = new THREE.BufferGeometry(); gp.setAttribute("position", new THREE.BufferAttribute(pts, 3));
    const poeira = new THREE.Points(gp, new THREE.PointsMaterial({ size: .09, map: this.textura([[0, "rgba(255,255,255,1)"], [1, "rgba(255,255,255,0)"]]),
      color: 0xA3DBF7, transparent: true, opacity: .55, depthWrite: false, blending: THREE.AdditiveBlending }));
    cena.add(poeira);

    // moléculas espalhadas pelo volume visível
    const moleculas = [];
    let area = { x: 8, yMin: -4, yMax: 2 };
    const ajustar = () => {
      const w = caixa.clientWidth || 1, h = caixa.clientHeight || 1;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
      // tela em pé: câmera mais longe, para as moléculas não ficarem grandes e amontoadas
      camera.position.z = camera.aspect < 1 ? 14 * Math.min(1.9, .82 / Math.max(camera.aspect, .4)) : 14;
      // faixa útil: abaixo do título e da frase (topo ~28% do palco) e acima da base
      const hy = Math.tan(THREE.MathUtils.degToRad(20)) * camera.position.z; area = { x: hy * camera.aspect * .82, yMin: -hy * .78, yMax: hy * .3 };
    };
    const obs = new ResizeObserver(ajustar); obs.observe(caixa); ajustar();
    const N = camera.aspect < .9 ? 8 : 11;
    for (let i = 0; i < N; i++) {
      const m = this.agua(mats, geo);
      let p, tent = 0;
      do { p = new THREE.Vector3((Math.random() * 2 - 1) * area.x, area.yMin + Math.random() * (area.yMax - area.yMin), -3 + Math.random() * 4.5); tent++; }
      while (tent < 80 && moleculas.some(o => o.userData.base.distanceTo(p) < 3));
      m.quaternion.setFromEuler(new THREE.Euler(Math.random() * 6.3, Math.random() * 6.3, Math.random() * 6.3));
      Object.assign(m.userData, { base: p, fase: Math.random() * 100, giro: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize(),
                                  vel: .15 + Math.random() * .25, entrada: i * .07, acao: null, q0: m.quaternion.clone() });
      m.position.copy(p); m.scale.setScalar(0);
      cena.add(m); moleculas.push(m);
    }

    // toque: acha a molécula sob o dedo e sorteia uma reação
    const raio = new THREE.Raycaster(), ponto = new THREE.Vector2();
    const alvos = moleculas.flatMap(m => m.userData.alvos.map(a => (a.userData.dono = m, a)));
    const acharMolecula = e => {
      const r = renderer.domElement.getBoundingClientRect();
      ponto.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      raio.setFromCamera(ponto, camera);
      const hit = raio.intersectObjects(alvos, false).find(h => h.object.userData.dono.userData.est.opac > .1);   // apagadas não respondem
      return hit ? hit.object.userData.dono : null;
    };
    const nomes = Object.keys(this.ACOES);
    renderer.domElement.addEventListener("pointerdown", e => {
      if (!estado.visivel || Palco.pausado) return;
      const m = acharMolecula(e); if (!m) return;
      const u = m.userData, ant = u.acao && u.acao.nome;
      const nome = nomes.filter(n => n !== ant)[Math.floor(Math.random() * (nomes.length - 1))];
      u.acao = { nome, t0: estado.t, dir: new THREE.Vector3(Math.random() - .5, Math.random() - .5, (Math.random() - .5) * .4).normalize(),
                 eixo: new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize() };
    });
    renderer.domElement.addEventListener("pointermove", e => {
      if (e.pointerType !== "mouse") return;
      renderer.domElement.style.cursor = estado.visivel && acharMolecula(e) ? "pointer" : "";
    });

    // relógio próprio: anda enquanto a cena está visível e o áudio não está pausado
    const estado = { t: 0, visivel: false, moleculas, camera };
    let antes = performance.now();
    const saida = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
    const suave = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);

    // ---- roteiro: animações no relógio da cena (congelam junto com o áudio) ----
    const tweens = [], pulsos = [];
    // anima obj[chave] até "para" em "dur" segundos (com atraso opcional)
    estado.animar = (obj, chave, para, dur, atraso = 0) => tweens.push({ obj, chave, para, dur, t0: estado.t + atraso, de: null });
    // pulso com brilho numa molécula
    estado.pulsar = (m, dur = .6, atraso = 0) => pulsos.push({ m, dur, t0: estado.t + atraso });
    // posição da molécula na tela (px, relativo à cena)
    estado.naTela = v => { const p = v.clone().project(camera); return { x: (p.x + 1) / 2 * caixa.clientWidth, y: (1 - p.y) / 2 * caixa.clientHeight }; };
    // a molécula visível mais alta da tela
    estado.topo = () => moleculas.filter(m => m.userData.est.opac > .5)
      .reduce((a, b) => estado.naTela(b.position).y < estado.naTela(a.position).y ? b : a);
    // leva a molécula ao centro, mais perto, e a vira de frente (O em cima)
    estado.destacar = (m, dur = 1.6) => {
      const s = m.userData.est;
      // centro da molécula a 54% (tela deitada) ou 44% (em pé) da altura: sobra espaço embaixo para a legenda e as opções
      const D = camera.position.z * .7, meiaAltura = Math.tan(THREE.MathUtils.degToRad(20)) * D, f = camera.aspect >= 1 ? .54 : .44;
      Object.assign(s, { de: m.position.clone(), qDe: m.quaternion.clone(), qPara: new THREE.Quaternion(),
        para: new THREE.Vector3(0, (1 - 2 * f) * meiaAltura, camera.position.z - D), fixa: true, mov: dur ? 0 : 1 });
      if (dur) estado.animar(s, "mov", 1, dur);
    };
    // símbolos (H, O) desenhados sobre as esferas
    const rotulo = (letra, cor) => {
      const c = document.createElement("canvas"); c.width = c.height = 128;
      const g = c.getContext("2d"); g.fillStyle = cor; g.font = "800 92px 'Bricolage Grotesque', 'Segoe UI', sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(letra, 64, 70);
      const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, opacity: 0, depthTest: false, depthWrite: false }));
      s.renderOrder = 10; cena.add(s); return s;
    };
    estado.rotular = m => {
      const u = m.userData;
      if (!u.rotulos) u.rotulos = { O: rotulo("O", "#FFFFFF"), H: u.Hs.map(() => rotulo("H", "#0A1322")) };
    };
    const pAtomo = new THREE.Vector3(), paraCam = new THREE.Vector3();
    const posicionarRotulo = (sprite, atomo, raio, opac) => {
      atomo.getWorldPosition(pAtomo);
      paraCam.copy(camera.position).sub(pAtomo).normalize();
      sprite.position.copy(pAtomo).addScaledVector(paraCam, raio * 1.02);
      sprite.scale.setScalar(raio * 1.5);
      sprite.material.opacity = opac;
    };
    const quadro = () => {
      if (!renderer.domElement.isConnected) { obs.disconnect(); renderer.dispose(); return; }
      const agora = performance.now(), dt = Math.min((agora - antes) / 1000, .1); antes = agora;
      if (!estado.visivel) { requestAnimationFrame(quadro); return; }   // montado e invisível: não gasta GPU
      if (!Palco.pausado) estado.t += dt;
      const t = estado.t;
      // roteiro: avança as animações de variáveis e os pulsos
      for (let i = tweens.length - 1; i >= 0; i--) {
        const w = tweens[i]; if (t < w.t0) continue;
        if (w.de === null) w.de = w.obj[w.chave];
        const p = Math.min((t - w.t0) / w.dur, 1);
        w.obj[w.chave] = w.de + (w.para - w.de) * suave(p);
        if (p >= 1) tweens.splice(i, 1);
      }
      moleculas.forEach(m => { m.userData.est.pulso = 0; });
      for (let i = pulsos.length - 1; i >= 0; i--) {
        const pu = pulsos[i], p = (t - pu.t0) / pu.dur;
        if (p >= 1) { pulsos.splice(i, 1); continue; }
        if (p >= 0) pu.m.userData.est.pulso = Math.max(pu.m.userData.est.pulso, Math.sin(p * Math.PI));
      }
      moleculas.forEach(m => {
        const u = m.userData, s = u.est, e = Math.min(Math.max((t - u.entrada) / .7, 0), 1);
        m.visible = s.opac > .01;
        if (!m.visible) return;
        if (s.fixa) {
          // em destaque: vai até a frente da tela e fica parada, de frente
          const k = suave(s.mov);
          m.position.lerpVectors(s.de, s.para, k);
          m.quaternion.slerpQuaternions(s.qDe, s.qPara, k);
        } else {
          // deriva lenta (agitação térmica) e giro próprio
          m.position.set(u.base.x + Math.sin(t * .31 + u.fase) * .5, u.base.y + Math.sin(t * .27 + u.fase * 1.7) * .4, u.base.z + Math.sin(t * .23 + u.fase * .6) * .5);
          m.quaternion.copy(u.q0).multiply(new THREE.Quaternion().setFromAxisAngle(u.giro, t * u.vel));
        }
        m.scale.setScalar((e > 0 ? saida(e) : 0) * (1 + .22 * s.pulso));
        u.O.scale.setScalar(u.rO * s.escalaO);
        u.nuvem.material.opacity = (.55 + .12 * Math.sin(t * 2.1 + u.fase) + .9 * s.pulso) * s.opac;   // nuvem eletrônica "respirando"
        u.mats.forEach(x => { x.opacity = s.opac; x.emissiveIntensity = .55 * s.pulso; x.depthWrite = s.opac > .95; });
        u.Hs.forEach((h, i) => { h.position.copy(u.baseH[i]); h.scale.setScalar(u.rH * s.escalaH * s["h" + i]); });
        if (u.acao) {
          const A = this.ACOES[u.acao.nome], p = (t - u.acao.t0) / A.dur;
          if (p >= 1) u.acao = null;
          else A.f(m, Math.max(p, 0), u.acao);
        }
        this.alinharBastoes(u);
        if (u.rotulos) {
          m.updateMatrixWorld();
          const esc = m.scale.x;
          posicionarRotulo(u.rotulos.O, u.O, u.rO * s.escalaO * esc, s.rotO * s.opac);
          u.rotulos.H.forEach((r, i) => posicionarRotulo(r, u.Hs[i], u.rH * s.escalaH * s["h" + i] * esc, s.rotH * s.opac));
        }
      });
      poeira.material.opacity = .4 + .15 * Math.sin(t * 1.3);
      poeira.rotation.y = t * .01;
      renderer.render(cena, camera);
      requestAnimationFrame(quadro);
    };
    renderer.render(cena, camera);             // compila já na montagem
    requestAnimationFrame(quadro);
    if (revelar) estado.visivel = true;
    return estado;
  }
};

/* ---------- Cenas da narração 4: a fórmula da água ---------- */
const Cena4 = {
  $(sel) { return Palco.el.querySelector(sel); },
  get q() { return Cena3.quantum; },
  // 2s → 4,5s: cada molécula pulsa com brilho, uma depois da outra (da esquerda para a direita)
  pulsarTodas() {
    const q = this.q; if (!q) return;
    const lista = q.moleculas.filter(m => m.userData.est.opac > .5).sort((a, b) => q.naTela(a.position).x - q.naTela(b.position).x);
    const passo = lista.length > 1 ? 2 / (lista.length - 1) : 0;     // último pulso (0,5s) termina em 4,5s
    lista.forEach((m, i) => q.pulsar(m, .5, i * passo));
  },
  // 6s: todas somem em fade; fica só a de cima, que vem para a frente
  ficarUma() {
    const q = this.q; if (!q) return;
    const m = this.m = q.topo();
    q.moleculas.forEach(o => { if (o !== m) q.animar(o.userData.est, "opac", 0, 1); });
    q.destacar(m);
  },
  // 20,2s: "Fórmula Química" digitada logo abaixo da molécula
  formula() {
    if (!this.m || this.$(".c4-formula")) return;
    Palco.adicionar(`<p class="c4-formula"></p>`);
    this.posicionarFormula();
    Palco.digitar(this.$(".c4-formula"), "Fórmula Química", 1);
  },
  posicionarFormula() {
    const el = this.$(".c4-formula"), q = this.q; if (!el || !q) return;
    const s = this.m.userData.est, baixo = s.para.clone().add(new THREE.Vector3(0, -1.55, 0));

  },
  pulsar() { if (this.m) this.q.pulsar(this.m, .9); },
  // 16,6 → 18,7s: os 3 átomos crescem em sequência (H esquerdo, O, H direito); quando um cresce, o anterior volta
  atomosEmSequencia() {
    if (!this.m) return;
    const s = this.m.userData.est, q = this.q, d = .35;
    q.animar(s, "h0", 1.35, d, 0);
    q.animar(s, "h0", 1, d, .7);  q.animar(s, "escalaO", 1.3, d, .7);
    q.animar(s, "escalaO", 1, d, 1.4); q.animar(s, "h1", 1.35, d, 1.4);
    q.animar(s, "h1", 1, d, 1.75);                                   // termina em 18,7s
  },
  hMaiores() { if (this.m) this.q.animar(this.m.userData.est, "escalaH", 1.35, .4); },
  simboloH() { if (!this.m) return; this.q.rotular(this.m); this.q.animar(this.m.userData.est, "rotH", 1, .8); },
  oMaior() {
    if (!this.m) return;
    const s = this.m.userData.est, q = this.q;
    q.rotular(this.m);
    q.animar(s, "escalaH", 1, .4); q.animar(s, "escalaO", 1.3, .4); q.animar(s, "rotO", 1, .8);

  // Fim do áudio 4: três opções de fórmula
  opcoes() {
    if (this.$(".c4-opcoes")) return;
    Palco.adicionar(`
      <div class="c4-opcoes" role="group" aria-label="Qual é a fórmula da água?">
        <button class="c4-op" data-certa="0">HO</button>
        <button class="c4-op" data-certa="1">H<sub>2</sub>O</button>
        <button class="c4-op" data-certa="0">HO<sub>2</sub></button>
      </div>`);
    const caixa = this.$(".c4-opcoes"), f = this.$(".c4-formula");
    if (f) Object.assign(caixa.style, { top: `${f.offsetTop + f.offsetHeight + 16}px`, bottom: "auto" });   // logo abaixo de "Fórmula Química"
    [...caixa.children].forEach((b, i) => Palco.animar(b, [{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }],
      { duracao: .45, atraso: i * .12, easing: "cubic-bezier(.3,1.4,.5,1)" }));
    caixa.addEventListener("click", e => {

  acertou(b) {
