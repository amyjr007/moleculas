    this.$(".c4-verde").animate([{ opacity: 0 }, { opacity: 1, offset: .25 }, { opacity: 0 }], { duration: 1600, easing: "ease-out" })
      .finished.then(() => { const v = this.$(".c4-verde"); v && v.remove(); });
    Confete.soltar({ de: "cantos" });
    Confete.soltar({ de: "topo" });
    if (this.m) this.q.pulsar(this.m, .9);
    const sons = ["audio/vfx/applause.mp3", "audio/funfare.mp3"].map(src => { const a = new Audio(src); a.play().catch(() => {}); return a; });
    const fim = a => new Promise(r => { a.addEventListener("ended", r, { once: true }); a.addEventListener("error", r, { once: true }); setTimeout(r, 15000); });
    const palco = Palco.el.firstElementChild;
    Promise.all(sons.map(fim)).then(() => {
      if (Player.indice !== 4 || Palco.el.firstElementChild !== palco) return;   // saiu da cena no meio da festa
      const r = NARRACOES.findIndex(n => n.id === "dialogo4R");

  // tela final da narração 4 (para quem pula direto para a narração da resposta)
  montarFinal() {
    if (this.$(".c4-formula")) return;
    Cena3.montarFinal();
    const q = this.q; if (!q) return;
    const m = this.m = q.topo();
    q.moleculas.forEach(o => { if (o !== m) o.userData.est.opac = 0; });
    q.destacar(m, 0);

    q.rotular(m);

/* ---------- Cenas da narração 4R: a resposta (volta ao copo) ---------- */
const Cena4R = {
  $(sel) { return Palco.el.querySelector(sel); },

  // 1s: três pulsos com brilho no botão H₂O
  pulsarFormula() {
    const b = this.$(".c4-op.certa"); if (!b) return;
    const base = "0 0 0 4px rgba(110,231,160,.25), 0 0 30px rgba(110,231,160,.5)";
    const forte = "0 0 0 9px rgba(110,231,160,.45), 0 0 70px rgba(110,231,160,.95)";
    const q = [];
    for (let i = 0; i < 3; i++) q.push({ transform: "scale(1)", boxShadow: base, offset: i / 3 }, { transform: "scale(1.18)", boxShadow: forte, offset: i / 3 + 1 / 6 });
    q.push({ transform: "scale(1)", boxShadow: base, offset: 1 });
    Palco.animar(b, q, { duracao: 1.5, easing: "ease-in-out", fill: "none" });
  },

  // 3s: o copo já nasce montado (invisível, atrás do mundo quântico), para não travar o clarão
  preparar() {
    if (this.$(".c5-copo")) return;
    const frase = this.$(".c3-frase");
    Palco.adicionar(`<div class="c5-copo" aria-label="Um copo com água"></div>`);
    const caixa = this.$(".c5-copo");
    caixa.style.top = frase ? `${frase.offsetTop + frase.offsetHeight + 6}px` : "28%";
    this.ctx = Copo.montar(caixa, this.roteiro);
  },

  // câmera e molécula presas ao tempo do áudio 4R
  roteiro: {
    indice: 5,
    montar(ctx) {
      const T = ctx.THREE, mat = cor => new T.MeshPhysicalMaterial({ color: cor, roughness: .3, clearcoat: .7, clearcoatRoughness: .18 });
      const mats = { O: mat(Quantico.CORES.O), H: mat(Quantico.CORES.H), ligacao: mat(Quantico.CORES.ligacao), nuvem: new T.SpriteMaterial({ transparent: true, opacity: 0 }) };
      const geo = { esfera: new T.SphereGeometry(1, 48, 32), bastao: new T.CylinderGeometry(.13, .13, 1, 24, 1, true) };
      ctx.mol = Quantico.agua(mats, geo);
      ctx.mol.userData.nuvem.visible = false;
      ctx.mol.visible = false;
      ctx.cena.add(ctx.mol);
    },
    ajustar(ctx) {
      const T = ctx.THREE, deitada = ctx.camera.aspect >= 1.1;
      // tela deitada: copo à esquerda, molécula à direita · em pé: molécula acima do copo
      ctx.gx = deitada ? -1.75 : 0;
      ctx.copo.position.x = ctx.gx;
      ctx.alvoMol = deitada ? new T.Vector3(1.95, 1.8, .3) : new T.Vector3(0, 4.8, .3);
      const c = deitada ? { x0: -3.1, x1: 3.3, y0: -.25, y1: 3.35 } : { x0: -1.6, x1: 1.6, y0: -.25, y1: 6.15 };
      const tg = Math.tan(T.MathUtils.degToRad(14));
      ctx.fim = { cx: (c.x0 + c.x1) / 2, cy: (c.y0 + c.y1) / 2, dist: 1.04 * Math.max((c.y1 - c.y0) / 2 / tg, (c.x1 - c.x0) / 2 / (tg * ctx.camera.aspect)) };
    },
    posicionar(t, ctx) {
      const T = ctx.THREE, cam = ctx.camera, f = ctx.fim;
      const suave = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
      // 5,5 → 7s: "reação inversa" — de dentro da água, a câmera recua até mostrar o copo inteiro
      const z = suave((t - 5.5) / 1.5);
      const de = new T.Vector3(ctx.gx, 1.2, .9), olhaDe = new T.Vector3(ctx.gx, 1.08, 0);
      const para = new T.Vector3(f.cx, f.cy + f.dist * .12, f.dist), olhaPara = new T.Vector3(f.cx, f.cy, 0);
      cam.position.lerpVectors(de, para, z);
      cam.fov = 52 + (28 - 52) * z;
      cam.lookAt(olhaDe.lerp(olhaPara, z)); cam.updateProjectionMatrix();
      // 9 → 11s: uma molécula sai girando de dentro da água e para, de frente
      const m = ctx.mol, p = (t - 9) / 2;
      m.visible = p > 0;
      if (p > 0) {
        const k = 1 - Math.pow(1 - Math.min(p, 1), 3);
        const saida = new T.Vector3(ctx.gx, 1.85, 0);
        m.position.lerpVectors(saida, ctx.alvoMol, k);
        m.position.y += Math.sin(k * Math.PI) * .7;                   // sobe em arco
        m.quaternion.setFromEuler(new T.Euler((1 - k) * Math.PI * .8, (1 - k) * Math.PI * 4, (1 - k) * Math.PI * .5));
        m.scale.setScalar(.85 * (.12 + .88 * k));
      }
    }
  },

  // 5s: dash ao contrário — as linhas convergem e um clarão (pico em 5,5s) esconde a troca de cena
  voltar() {
    Palco.adicionar(`<div class="c3-dash c5-dash"></div><div class="c3-flash c5-flash"></div>`);
    Palco.animar(this.$(".c5-dash"), [
      { opacity: 0, transform: "scale(3) rotate(14deg)" },
      { opacity: 1, transform: "scale(1.2) rotate(6deg)", offset: .45 },
      { opacity: 0, transform: "scale(.3) rotate(0deg)" }
    ], { duracao: .8, easing: "cubic-bezier(.2,.6,.4,1)" });
    Palco.animar(this.$(".c5-flash"), [{ opacity: 0 }, { opacity: 1, offset: .45 }, { opacity: 0 }], { duracao: 1.1, easing: "ease-in-out" });
  },
  // 5,5s (sob o clarão): sai o mundo quântico e o quiz; fica o copo
  trocar() {
    if (!this.$(".c5-copo")) this.preparar();
    Palco.el.querySelectorAll(".c3-quantico, .c4-opcoes, .c4-formula").forEach(e => e.remove());
    this.$(".c5-copo").style.opacity = 1;
  },

  // 13s: lupa mágica discreta sobre a água, mostrando as moléculas lá dentro
  lupa() {
    const ctx = this.ctx, caixa = this.$(".c5-copo");
    if (!ctx || !caixa || this.$(".c5-lupa")) return;
    const c = ctx.naTela(new ctx.THREE.Vector3(ctx.gx, 1.05, .9)), borda = ctx.naTela(new ctx.THREE.Vector3(ctx.gx + .95, 1.05, .9));
    const d = Math.max(64, Math.round((borda.x - c.x) * 1.7));
    caixa.insertAdjacentHTML("beforeend", `<div class="c5-lupa" aria-label="Lupa mostrando as moléculas de água dentro do copo"><canvas></canvas></div>`);
    const lupa = this.$(".c5-lupa");
    Object.assign(lupa.style, { width: `${d}px`, height: `${d}px`, left: `${c.x - d / 2}px`, top: `${c.y - d / 2}px` });
    Palco.animar(lupa, [{ opacity: 0, transform: "scale(.6) rotate(-12deg)" }, { opacity: 1, transform: "scale(1) rotate(0deg)" }], { duracao: .7, easing: "cubic-bezier(.3,1.4,.5,1)" });
    Lupa.animar(lupa.querySelector("canvas"), d);
  },

  // 16s: a fórmula embaixo da molécula
  formula() {
    const ctx = this.ctx, caixa = this.$(".c5-copo");
    if (!ctx || !caixa || this.$(".c5-formula")) return;
    const p = ctx.naTela(ctx.alvoMol.clone().add(new ctx.THREE.Vector3(0, -1.2, 0)));
    caixa.insertAdjacentHTML("beforeend", `<p class="c5-formula">H<sub>2</sub>O</p>`);
    const f = this.$(".c5-formula");
    Object.assign(f.style, { left: `${p.x}px`, top: `${p.y}px` });
    Palco.animar(f, [{ opacity: 0, transform: "translate(-50%, 12px)" }, { opacity: 1, transform: "translate(-50%, 0)" }], { duracao: .7, easing: "ease-out" });
  }
};

/* ---------- Lupa: moléculas de água em miniatura, se agitando (canvas 2D) ---------- */
const Lupa = {
  animar(canvas, d) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = canvas.height = d * dpr;
    const g = canvas.getContext("2d"); g.scale(dpr, dpr);
    const R = d / 2, s = d * .055, ang = 52.25 * Math.PI / 180;
    const ms = Array.from({ length: 13 }, () => {
      const r = Math.sqrt(Math.random()) * (R - s * 2.2), a = Math.random() * Math.PI * 2;
      return { x: R + Math.cos(a) * r, y: R + Math.sin(a) * r, vx: (Math.random() - .5) * d * .12, vy: (Math.random() - .5) * d * .12,
               rot: Math.random() * 6.3, vr: (Math.random() - .5) * 2.4, esc: .8 + Math.random() * .35 };
    });
    const esfera = (x, y, r, claro, escuro) => {
      const gr = g.createRadialGradient(x - r * .35, y - r * .35, r * .1, x, y, r);
      gr.addColorStop(0, claro); gr.addColorStop(1, escuro);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    };
    let antes = performance.now();
    const quadro = agora => {
      if (!canvas.isConnected) return;
      const dt = Palco.pausado ? 0 : Math.min((agora - antes) / 1000, .05); antes = agora;
      g.clearRect(0, 0, d, d);
      ms.forEach(m => {
        m.x += m.vx * dt; m.y += m.vy * dt; m.rot += m.vr * dt;
        const dx = m.x - R, dy = m.y - R, lim = R - s * 2;
        if (Math.hypot(dx, dy) > lim) { const n = Math.hypot(dx, dy); m.vx -= 2 * (m.vx * dx + m.vy * dy) / (n * n) * dx; m.vy -= 2 * (m.vx * dx + m.vy * dy) / (n * n) * dy; m.x = R + dx / n * lim; m.y = R + dy / n * lim; }
        const e = s * m.esc, L = e * 1.55;
        const h1 = [m.x + Math.sin(m.rot - ang) * L, m.y + Math.cos(m.rot - ang) * L], h2 = [m.x + Math.sin(m.rot + ang) * L, m.y + Math.cos(m.rot + ang) * L];
        g.strokeStyle = "rgba(200,200,200,.9)"; g.lineWidth = e * .32;
        [h1, h2].forEach(h => { g.beginPath(); g.moveTo(m.x, m.y); g.lineTo(h[0], h[1]); g.stroke(); });
        [h1, h2].forEach(h => esfera(h[0], h[1], e * .58, "#ffffff", "#b9c7d6"));
        esfera(m.x, m.y, e, "#ff6b5e", "#b3000a");
      });
      requestAnimationFrame(quadro);
    };
    requestAnimationFrame(quadro);
  }
};

/* ---------- Confetes (canvas leve, sem biblioteca) ---------- */
const Confete = {
  CORES: ["#FFC24B", "#FF7A66", "#A3DBF7", "#7C9CFF", "#FFFFFF", "#6EE7A0"],
  soltar({ de = "cantos", qtd = 140 } = {}) {
    const P = Palco.el, dpr = Math.min(devicePixelRatio || 1, 2);
    const c = document.createElement("canvas"); c.className = "c4-confete"; P.appendChild(c);
    const W = P.clientWidth, H = P.clientHeight;
    c.width = W * dpr; c.height = H * dpr;
    const g = c.getContext("2d"); g.scale(dpr, dpr);
    const aleat = (a, b) => a + Math.random() * (b - a);
    const ps = Array.from({ length: qtd }, (_, i) => {
      let x, y, vx, vy;
      if (de === "topo") { x = aleat(0, W); y = aleat(-H * .3, -10); vx = aleat(-60, 60); vy = aleat(40, 160); }
      else { const esq = i % 2 === 0; x = esq ? 0 : W; y = H; vx = (esq ? 1 : -1) * aleat(180, 520); vy = -aleat(H * 1.1, H * 1.9); }
      return { x, y, vx, vy, w: aleat(6, 11), h: aleat(8, 15), rot: aleat(0, 6.3), vr: aleat(-9, 9), cor: this.CORES[i % this.CORES.length], giro: aleat(0, 6.3), redondo: Math.random() < .25 };
    });
    let antes = performance.now(), vida = 0;
    const passo = agora => {
      const dt = Math.min((agora - antes) / 1000, .05); antes = agora; vida += dt;
      g.clearRect(0, 0, W, H);
      let vivos = 0;
      ps.forEach(p => {
        p.vy += 900 * dt; p.vx *= .985; p.vy *= .99;
        p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.giro += 6 * dt;
        if (p.y < H + 30) vivos++;
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.giro));   // "virando" no ar
        g.fillStyle = p.cor;
        if (p.redondo) { g.beginPath(); g.arc(0, 0, p.w / 2, 0, Math.PI * 2); g.fill(); } else g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        g.restore();
      });
      if (vivos && vida < 6) requestAnimationFrame(passo); else c.remove();
    };
    requestAnimationFrame(passo);
  }
};

/* ---------- Fonte de áudio (real ou simulada) ---------- */
function criarFonte(narracao) {
  if (narracao.src) {
    const a = new Audio(narracao.src);
    a.preload = "auto";
    // pausa/retomada vinda de fora (fone, teclas de mídia, tela de bloqueio)
    a.addEventListener("pause", () => { if (!a.ended && Player.fonte === a) Player.pausar(); });
    a.addEventListener("play", () => { if (Player.fonte === a) Player.tocar(); });
    return a;
  }
  // Simulação: mesmo "formato" de um elemento <audio>
  let inicio = 0, acumulado = 0;
  return {
    duration: narracao.duracaoTeste || 10,
    paused: true,
    ended: false,
    get currentTime() {
      const t = this.paused ? acumulado : acumulado + (performance.now() - inicio) / 1000;
      return Math.min(t, this.duration);
    },
    set currentTime(v) { acumulado = v; inicio = performance.now(); },
    play() { this.ended = false; inicio = performance.now(); this.paused = false; return Promise.resolve(); },
    pause() { acumulado = this.currentTime; this.paused = true; }
  };
}

/* ---------- Player ---------- */
const Player = {
  indice: -1,
  fonte: null,
  disparados: new Set(),
  loop: null,

  // continuar = veio da narração anterior pelo play: a cena dela fica no palco.
  // Senão (entrada na página, navegação rápida) o palco é limpo e "inicio" monta a cena de partida.
  carregar(i, continuar = false) {
    this.parar();
    this.indice = i;
    const n = NARRACOES[i];
    this.fonte = criarFonte(n);
    this.disparados = new Set();
    if (continuar) Palco.pausado = false; else Palco.reiniciar();
    ui.progresso(0);
    if (n.inicio) n.inicio(Palco);      // cena de antes do play
    atualizarSumario();
  },

  tocar() {
    if (!this.fonte) return;
    if (this.fonte.paused) this.fonte.play().catch(() => { this.pausar(); });
    Palco.retomar();
    this.acompanhar();
    ui.atualizarBotao(true);
  },

  pausar() {
    if (!this.fonte) return;
    if (!this.fonte.paused) this.fonte.pause();
    Palco.pausar();
    cancelAnimationFrame(this.loop);
    ui.atualizarBotao(false);
  },

  parar() {
    const f = this.fonte;
    this.fonte = null;               // solta a fonte antes, para os eventos de "pause" dela serem ignorados
    if (f) { f.pause(); f.currentTime = 0; }
    cancelAnimationFrame(this.loop);
    ui.atualizarBotao(false);
  },

  irPara(i, continuar = false) {
    this.carregar(i, continuar);
    this.tocar();
  },

  acompanhar() {
    const passo = () => {
      const f = this.fonte;
      if (!f) return;
      const t = f.currentTime;
      const d = Number.isFinite(f.duration) ? f.duration : 0;
      ui.progresso(d ? t / d : 0);

      // Dispara eventos cujo tempo já passou
      NARRACOES[this.indice].eventos.forEach((ev, k) => {
        if (t >= ev.tempo && !this.disparados.has(k)) {
          this.disparados.add(k);
          try { ev.acao(Palco); } catch (e) { console.error(e); }
        }
      });

      const acabou = f.ended || (d && t >= d);
      if (acabou) { this.aoTerminar(); return; }
      if (!f.paused) this.loop = requestAnimationFrame(passo);
    };
    cancelAnimationFrame(this.loop);
    this.loop = requestAnimationFrame(passo);
  },

  aoTerminar() {
    if (this.fonte && !this.fonte.src) { this.fonte.paused = true; this.fonte.ended = true; }
    ui.atualizarBotao(false);
    this.terminou = true;
    const n = NARRACOES[this.indice];
    if (n.aoFim) try { n.aoFim(Palco); } catch (e) { console.error(e); }   // ex.: quiz no fim da narração
  },

  // Botão play: 1º clique = dialogo0; depois alterna pausa;
  // ao fim de uma narração, o próximo clique toca a seguinte.
  cliquePlay() {
    if (this.indice === -1) { this.irPara(0); return; }
    if (this.terminou) {
      this.terminou = false;
      // próxima narração da sequência (as "ocultas", como a resposta do quiz, só tocam por gatilho próprio)
      const seguinte = NARRACOES.findIndex((n, i) => i > this.indice && !n.oculta);
      const prox = seguinte >= 0 ? seguinte : this.indice;
      this.irPara(prox, prox !== this.indice);   // segue a história: a cena continua no palco
      return;
    }
    this.fonte.paused ? this.tocar() : this.pausar();
  },

  resetarTudo() {
    this.parar();
    this.indice = -1;
    this.fonte = null;
    this.terminou = false;
    Palco.reiniciar();
    atualizarSumario();
  }
};

/* ---------- Interface ---------- */
const ICONE_PLAY  = '<path d="M7 4.5v15l12-7.5z"/>';
const ICONE_PAUSE = '<rect x="6" y="4.5" width="4.2" height="15" rx="1"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1"/>';

const ui = {
  btnPlay: document.getElementById("btnPlay"),
  icone: document.getElementById("iconePlay"),
  atualizarBotao(tocando) {
    this.icone.innerHTML = tocando ? ICONE_PAUSE : ICONE_PLAY;
    this.btnPlay.classList.toggle("tocando", tocando);
    this.btnPlay.setAttribute("aria-label", tocando ? "Pausar narração" : "Tocar narração");
  },
  // fração do áudio já tocada (0 a 1) → anel em volta do play
  anel: document.getElementById("anelTempo"),
  progresso(fracao) {
    this.anel.style.strokeDashoffset = 100 - Math.min(Math.max(fracao || 0, 0), 1) * 100;
  }
};

/* ---------- Navegação entre telas ---------- */
const capa = document.getElementById("capa");
const pagina1 = document.getElementById("pagina1");

const semMovimento = matchMedia("(prefers-reduced-motion: reduce)");

// O que cada tela faz ao aparecer
function aoEntrar(tela) {
  if (tela === capa) { capa.classList.remove("play"); void capa.offsetWidth; capa.classList.add("play"); }
  if (tela === pagina1) Player.carregar(0);   // monta a fábrica no palco, à espera do play
}

// Troca de tela girando um cubo: ida gira para a esquerda, volta para a direita
function mostrarTela(tela) {
  const atual = document.querySelector(".tela.ativa");
  if (!atual || atual === tela || semMovimento.matches) {
    [capa, pagina1].forEach(t => t.classList.toggle("ativa", t === tela));
    aoEntrar(tela);
    return;
  }
  const volta = tela === capa;
  const sai = volta ? "cubo-sai-volta" : "cubo-sai";
  const entra = volta ? "cubo-entra-volta" : "cubo-entra";
  document.body.classList.add("girando");
  tela.classList.add("ativa", entra);
  atual.classList.add(sai);
  aoEntrar(tela);
  tela.addEventListener("animationend", function fim(e) {
    if (e.target !== tela) return;          // ignora animações dos filhos
    tela.removeEventListener("animationend", fim);
    atual.classList.remove("ativa", sai);
    tela.classList.remove(entra);
    document.body.classList.remove("girando");
  });
}

document.getElementById("btnIniciar").addEventListener("click", () => mostrarTela(pagina1));
document.getElementById("btnHome").addEventListener("click", () => {
  fecharGaveta();
  Player.resetarTudo();
  mostrarTela(capa);
});
ui.btnPlay.addEventListener("click", () => Player.cliquePlay());

/* ---------- Navegação rápida (sumário) ---------- */
const gaveta = document.getElementById("gaveta");
const veu = document.getElementById("veu");
const sumario = document.getElementById("sumario");

function montarSumario() {
  sumario.innerHTML = NARRACOES.map((n, i) => n.oculta ? "" : `
    <li>
      <button class="item-sumario" data-indice="${i}">
        <span class="num">${i + 1}</span>
        <span class="item-texto">${n.titulo}</span>
      </button>
    </li>`).join("");
}
function atualizarSumario() {
  sumario.querySelectorAll(".item-sumario").forEach(b => {
    const atual = Number(b.dataset.indice) === Player.indice;
    b.classList.toggle("atual", atual);
    b.setAttribute("aria-current", atual ? "true" : "false");
  });
}
function abrirGaveta() {
  gaveta.classList.add("aberta"); veu.classList.add("aberto");
  gaveta.setAttribute("aria-hidden", "false");
  document.getElementById("btnFechar").focus();
}
function fecharGaveta() {
  gaveta.classList.remove("aberta"); veu.classList.remove("aberto");
  gaveta.setAttribute("aria-hidden", "true");
}

document.getElementById("btnNavRapida").addEventListener("click", abrirGaveta);
document.getElementById("btnFechar").addEventListener("click", fecharGaveta);
veu.addEventListener("click", fecharGaveta);
sumario.addEventListener("click", e => {
  const b = e.target.closest(".item-sumario");
  if (!b) return;
  fecharGaveta();
  Player.terminou = false;
  Player.irPara(Number(b.dataset.indice));
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") fecharGaveta();
  if (e.code === "Space" && pagina1.classList.contains("ativa") && !gaveta.classList.contains("aberta")
      && document.activeElement.tagName !== "BUTTON") {
    e.preventDefault(); Player.cliquePlay();
  }
});

montarSumario();
mostrarTela(capa);

/* ---------- Sem zoom na tela ---------- */
// iOS ignora user-scalable=no: bloqueia a pinça (gesture*) e o arraste com dois dedos
["gesturestart", "gesturechange", "gestureend"].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// computador: Ctrl + roda do mouse / pinça do touchpad e Ctrl + / − / 0
document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && ["+", "=", "-", "_", "0"].includes(e.key)) e.preventDefault();
});

/* ---------- PWA: instala o service worker (só quando servido por http/https) ---------- */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
