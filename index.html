<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moléculas</title>
<meta name="description" content="Audiobook interativo sobre ligações químicas: ouça, observe e aprenda a montar moléculas passo a passo.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moléculas">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  /* fontes locais: o app abre com a tipografia certa mesmo sem internet */
  @font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 500 800; font-display: swap; src: url(fontes/bricolage-grotesque.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 400; font-display: swap; src: url(fontes/atkinson-hyperlegible-400.woff2) format("woff2"); }
  @font-face { font-family: "Atkinson Hyperlegible"; font-style: normal; font-weight: 700; font-display: swap; src: url(fontes/atkinson-hyperlegible-700.woff2) format("woff2"); }

  :root {
    --celeste: #A3DBF7;
    --celeste-claro: #D3EFFC;
    --celeste-escuro: #6FC0EA;
    --preto: #0A1322;
    --grafite: #1B2A40;
    --branco: #FFFFFF;
    --ambar: #FFC24B;
    --ambar-claro: #FFD98A;
    --coral: #FF7A66;
    --anil: #7C9CFF;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --texto: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  /* Identidade fixa nos dois temas: marinho profundo + celeste, com acentos quentes (âmbar e coral) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --celeste: #A3DBF7; --preto: #0A1322; }
  }
  :root[data-theme="dark"] { --celeste: #A3DBF7; --preto: #0A1322; }

  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--preto); }
  body {
    height: 100%;
    background: var(--preto);
    color: var(--branco);
    font-family: var(--texto);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  button:focus-visible { outline: 3px solid var(--celeste); outline-offset: 3px; }
  img, svg { max-width: 100%; }

  .tela { position: absolute; inset: 0; display: none; flex-direction: column; }
  .tela.ativa { display: flex; }

  /* ---------- CAPA (variação A: Esteira) ---------- */
  #capa {
    --pad-y: clamp(20px, 5vh, 56px); --pad-x: clamp(20px, 5vw, 80px);
    --cel: var(--celeste); --cel-d: var(--celeste-escuro); --cel-l: var(--celeste-claro);
    background:
      radial-gradient(60% 55% at 85% 20%, rgba(124,156,255,.16), transparent 70%),
      radial-gradient(45% 45% at 5% 100%, rgba(255,122,102,.12), transparent 70%),
      var(--preto);
    color: var(--branco);
    grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr);
    align-items: center; gap: clamp(16px, 4vw, 64px);
    padding: var(--pad-y) var(--pad-x) calc(var(--pad-y) + 24px);
    overflow-x: hidden; overflow-y: auto;
  }
  #capa.ativa { display: grid; }
  /* logo acima do título; entra com o mesmo "pop" dos átomos */
  #capa .logo-capa { display: block; width: clamp(52px, 5vw + 24px, 84px); aspect-ratio: 300 / 412; height: auto; margin: 0 0 1.1rem; filter: drop-shadow(0 10px 24px rgba(124,156,255,.28)); }
  #capa.play .logo-capa { animation: pop .6s cubic-bezier(.3,1.6,.5,1) both; transform-origin: 50% 80%; }
  @media (prefers-reduced-motion: reduce) { #capa.play .logo-capa { animation: none; } }
  #capa h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.7rem, 4.4vw + 1rem, 5.6rem); line-height: .92; letter-spacing: -.035em; margin: 0 0 .38em; }
  #capa h1 .l1 { display: block; font-weight: 500; letter-spacing: -.02em; }
  #capa h1 .l2 { display: block; color: var(--celeste); }
  #capa .lede { margin: 0 0 1.8rem; font-size: clamp(1.02rem, .5vw + .85rem, 1.25rem); line-height: 1.5; max-width: 31rem; }
  .btn-iniciar {
    display: inline-flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 32px 0 12px;
    border-radius: 999px; background: var(--ambar); color: var(--preto);
    font: 800 1.2rem/1 var(--display); letter-spacing: .01em;
    transition: transform .15s ease, background-color .15s ease;
  }
  .btn-iniciar .ico { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--preto); color: var(--ambar); }
  .btn-iniciar .ico svg { width: 14px; height: 14px; margin-left: 3px; }
  .btn-iniciar:hover { transform: translateY(-2px); background: var(--ambar-claro); }
  .btn-iniciar:active { transform: translateY(0); }
  .btn-iniciar:focus-visible { outline-color: var(--branco); outline-offset: 4px; }
  /* crédito do autor: retrato em "átomo" com anel celeste */
  #capa .credit { display: flex; align-items: center; gap: 14px; margin-top: 2.2rem; }
  /* versão publicada (atualizada automaticamente pelo publicar.ps1) */
  #capa .versao { position: absolute; right: var(--pad-x); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: .72rem; letter-spacing: .08em; color: #93A3BA; opacity: .75; font-variant-numeric: tabular-nums; }
  #capa .avatar {
    position: relative; flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
    background: var(--celeste-claro);
    box-shadow: 0 0 0 3px var(--preto), 0 0 0 5px var(--celeste), 0 0 0 11px rgba(163,219,247,.14);
  }
  /* recorte ampliado centrado no rosto, espelhado */
  #capa .avatar img { position: absolute; width: 180%; max-width: none; left: -18%; top: -21%; transform: scaleX(-1); }
  #capa .credit-txt { display: flex; flex-direction: column; gap: 2px; line-height: 1.15; }
  #capa .credit-txt small { font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--ambar); }
  #capa .credit-txt strong { font-family: var(--display); font-weight: 800; font-size: 1.1rem; letter-spacing: -.01em; }

  #capa .art { display: block; width: 100%; height: auto; overflow: visible; max-height: calc(100dvh - 2 * var(--pad-y) - 24px); }
  #capa .atom text { font-family: var(--display); font-weight: 800; text-anchor: middle; dominant-baseline: central; }
  #capa .bond { stroke-width: 5; stroke: var(--cel-l); }
  #capa .arm { fill: none; stroke-width: 14; stroke-linecap: round; stroke-linejoin: round; stroke: var(--ambar); }
  #capa .arm-outer { fill: none; stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; stroke: var(--preto); }
  #capa .joint { stroke-width: 4; fill: var(--preto); stroke: var(--ambar); }
  #capa .grip { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke: var(--ambar); }
  #capa .gear, #capa .roller { fill: none; stroke-width: 3; stroke-linejoin: round; stroke: var(--cel-d); }
  #capa .rail { stroke-width: 6; stroke-linecap: round; }
  #capa .rail, #capa .leg, #capa .floor { stroke: var(--cel-d); }
  #capa .leg, #capa .floor { stroke-width: 3; stroke-linecap: round; }
  #capa .belt { fill: none; stroke-width: 3.5; stroke: var(--cel); }
  #capa .belt-tex { stroke-width: 3; stroke-dasharray: 2 16; stroke-linecap: round; stroke: var(--cel-d); }
  #capa .carriage { fill: var(--ambar); }
  #capa .cap { font: 700 13px var(--texto); letter-spacing: .18em; text-transform: uppercase; text-anchor: middle; fill: #fff; opacity: .85; }
  #capa .done { opacity: .9; }
  #capa .stamp { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .14em; fill: var(--ambar); }
  #capa .atom circle:first-child { stroke: var(--preto); stroke-width: 2.5; }
  #capa .a-c circle:first-child { fill: var(--cel); }
  #capa .a-o circle:first-child { fill: var(--coral); }
  #capa .a-n circle:first-child { fill: var(--anil); }
  #capa .a-h circle:first-child { fill: #fff; }
  #capa .atom text { fill: var(--preto); }
  #capa .shine { fill: #fff; opacity: .45; }

  /* animação única: átomos se conectando ao abrir a capa */
  #capa.play .pop { animation: pop .55s cubic-bezier(.3,1.6,.5,1) both; animation-delay: var(--d, 0s); }
  #capa.play .draw { stroke-dasharray: 1 1; stroke-dashoffset: 1; animation: draw .45s ease-out forwards; animation-delay: var(--d, 0s); }
  @keyframes pop { from { transform: scale(0); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) { #capa.play .pop, #capa.play .draw { animation: none; stroke-dashoffset: 0; } }

  /* fábrica em funcionamento: engrenagens engrenadas, roletes e lona da esteira */
  #capa .g1 { transform-box: view-box; transform-origin: 528px 150px; animation: girar 14s linear infinite; }
  #capa .g2 { transform-box: view-box; transform-origin: 612px 262px; animation: girar 7s linear infinite reverse; }
  #capa .roller { transform-box: fill-box; transform-origin: center; animation: girar 1.6s linear infinite reverse; }
  #capa .belt-tex { animation: esteira .5s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes esteira { to { stroke-dashoffset: 18; } }
  @media (prefers-reduced-motion: reduce) { #capa .g1, #capa .g2, #capa .roller, #capa .belt-tex { animation: none; } }

  /* retrato / celular */
  @media (max-aspect-ratio: 5/6), (max-width: 700px) {
    #capa { grid-template-columns: 1fr; align-content: center; gap: 12px; padding: calc(var(--pad-y) + 12px) var(--pad-x) var(--pad-y); }
    #capa .art { order: -1; max-height: 40dvh; }
    #capa .credit { margin-top: 26px; }
    .btn-iniciar { width: 100%; max-width: 420px; justify-content: center; padding: 0 24px 0 12px; }
    .btn-iniciar .ico { margin-right: auto; }
    .btn-iniciar .lbl { margin-right: auto; transform: translateX(-19px); }
  }

  /* ---------- PÁGINA 1 ---------- */
  #pagina1 { background: var(--preto); }
  .topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px clamp(16px, 4vw, 32px);
    gap: 12px;
  }
  .marca {
    font-family: var(--display); font-weight: 800;
    color: var(--celeste); font-size: 1.1rem;
    display: flex; align-items: center; gap: .5em;
  }
  .marca svg { width: 25px; height: 34px; }
  .btn-home {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    color: var(--celeste);
    font-size: .8rem; font-weight: 700;
    padding: 6px 10px; border-radius: 12px;
  }
  .btn-home svg { width: 28px; height: 28px; }
  .btn-home:hover { background: var(--grafite); }

  .palco {
    flex: 1; position: relative;
    margin: 0 clamp(12px, 3vw, 28px);
    border-radius: 24px;
    border: 2px solid var(--grafite);
    background-color: var(--preto);
    background-image: radial-gradient(circle, rgba(163,219,247,.16) 1.6px, transparent 1.8px);
    background-size: 28px 28px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  #conteudoPalco { position: absolute; inset: 0; }

  .faixa-player {
    display: flex; align-items: center; gap: 14px;
    padding: 14px clamp(16px, 4vw, 32px) 10px;
  }
  .info-faixa { flex: 1; min-width: 0; }
  .nome-faixa {
    color: var(--celeste-claro); font-size: .95rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .barra { height: 6px; background: var(--grafite); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .barra-preenchida { height: 100%; width: 0%; background: linear-gradient(90deg, var(--celeste), var(--ambar)); border-radius: 3px; }
  .tempo { font-size: .8rem; color: #93A3BA; margin-top: 5px; font-variant-numeric: tabular-nums; }

  .btn-play {
    width: 76px; height: 76px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--ambar); color: var(--preto);
    display: grid; place-items: center;
    box-shadow: 0 0 0 6px rgba(255,194,75,.18);
    transition: transform .15s ease, box-shadow .2s ease, opacity .7s ease, visibility 0s;
  }
  .btn-play:hover { transform: scale(1.05); }
  .btn-play:active { transform: scale(.95); }
  .btn-play svg { width: 34px; height: 34px; }
  .btn-play.tocando { box-shadow: 0 0 0 10px rgba(255,194,75,.28); }

  /* abertura da página: play grande no centro do palco */
  .btn-play.central {
    position: absolute; z-index: 3;
    left: var(--play-x, 50%); top: var(--play-y, 50%);
    width: clamp(120px, 22vmin, 180px); height: clamp(120px, 22vmin, 180px);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 12px rgba(255,194,75,.16), 0 18px 60px rgba(255,194,75,.25);
    animation: pulsar 2.2s ease-in-out infinite;
  }
  .btn-play.central svg { width: 44%; height: 44%; margin-left: 6%; }
  .btn-play.central:hover { transform: translate(-50%, -50%) scale(1.05); }
  .btn-play.central:active { transform: translate(-50%, -50%) scale(.96); }
  @keyframes pulsar {
    50% { box-shadow: 0 0 0 26px rgba(255,194,75,.06), 0 18px 60px rgba(255,194,75,.32); }
  }
  /* depois do 1º toque: some e só volta (no canto, em fade) quando a narração termina */
  .btn-play.oculto { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .3s ease, visibility 0s .3s; }
  #pagina1.abertura .info-faixa { opacity: 0; }
  .info-faixa { transition: opacity .6s ease; }
  @media (prefers-reduced-motion: reduce) { .btn-play.central { animation: none; } }

  .nav-rapida-barra {
    border-top: 2px solid var(--grafite);
    padding: 10px clamp(16px, 4vw, 32px) 12px;
  }
  .btn-nav-rapida {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: .6em;
    color: var(--celeste);
    font-weight: 700; font-size: 1rem;
    padding: 12px; border-radius: 14px;
  }
  .btn-nav-rapida:hover { background: var(--grafite); }
  .btn-nav-rapida svg { width: 22px; height: 22px; }

  /* ---------- SUMÁRIO (sobe de baixo) ---------- */
  .veu {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 10;
  }
  .veu.aberto { opacity: 1; pointer-events: auto; }
  .gaveta {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    max-width: 640px; margin: 0 auto;
    max-height: 75%;
    background: var(--celeste); color: var(--preto);
    border-radius: 26px 26px 0 0;
    padding: 10px 0 calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%);
    transition: transform .32s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  .gaveta.aberta { transform: translateY(0); }
  .alca { width: 44px; height: 5px; background: rgba(0,0,0,.35); border-radius: 3px; margin: 0 auto 8px; }
  .gaveta-topo {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 20px 12px;
  }
  .gaveta-topo h2 { font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
  .btn-fechar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--preto); color: var(--celeste);
    display: grid; place-items: center;
  }
  .btn-fechar svg { width: 20px; height: 20px; }
  .btn-fechar:focus-visible { outline-color: var(--preto); }
  .sumario { list-style: none; padding: 0 12px; overflow-y: auto; }
  .item-sumario {
    width: 100%; text-align: left;
    display: flex; align-items: center; gap: 14px;
    padding: 12px; border-radius: 16px;
    color: var(--preto);
  }
  .item-sumario:hover { background: rgba(255,255,255,.35); }
  .item-sumario:focus-visible { outline-color: var(--preto); }
  .item-sumario.atual { background: var(--preto); color: var(--celeste); }
  .num {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%;
    border: 3px solid currentColor;
    display: grid; place-items: center;
    font-family: var(--display); font-weight: 800; font-size: 1.05rem;
  }
  .item-texto { font-weight: 700; font-size: 1.05rem; line-height: 1.3; }

  @media (max-height: 560px) {
    .btn-play { width: 62px; height: 62px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .gaveta, .veu { transition: none; }
  }

  /* ---------- TRANSIÇÃO EM CUBO entre capa e página ---------- */
  body { perspective: 1800px; }
  .tela { backface-visibility: hidden; }
  body.girando { pointer-events: none; }
  .cubo-sai        { transform-origin: 100% 50%; animation: cuboSai   .9s cubic-bezier(.65,0,.35,1) both; }
  .cubo-entra      { transform-origin:   0% 50%; animation: cuboEntra .9s cubic-bezier(.65,0,.35,1) both; }
  .cubo-sai-volta  { transform-origin:   0% 50%; animation: cuboSaiVolta   .9s cubic-bezier(.65,0,.35,1) both; }
  .cubo-entra-volta{ transform-origin: 100% 50%; animation: cuboEntraVolta .9s cubic-bezier(.65,0,.35,1) both; }
  @keyframes cuboSai        { to   { transform: translateX(-100%) rotateY(-90deg); filter: brightness(.35); } }
  @keyframes cuboEntra      { from { transform: translateX(100%)  rotateY(90deg);  filter: brightness(.35); } }
  @keyframes cuboSaiVolta   { to   { transform: translateX(100%)  rotateY(90deg);  filter: brightness(.35); } }
  @keyframes cuboEntraVolta { from { transform: translateX(-100%) rotateY(-90deg); filter: brightness(.35); } }
</style>
</head>
<body>

<!-- Logo: rede molecular (mesma forma do ícone do app), nas cores do tema -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

<!-- ================= CAPA ================= -->
<section id="capa" class="tela ativa" aria-label="Capa">
  <div class="text">
    <svg class="logo-capa" aria-hidden="true"><use href="#logo"/></svg>
    <h1><span class="l2">Moléculas</span></h1>
    <p class="lede">Um audiobook interativo sobre ligações químicas: ouça, observe e aprenda a montar moléculas passo a passo.</p>
    <button class="btn-iniciar" id="btnIniciar" type="button"><span class="ico"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M0 0L12 7L0 14Z" fill="currentColor"/></svg></span><span class="lbl">Iniciar</span></button>
    <span class="versao" id="versao">v5 · 29/09/2026</span>
    <div class="credit">
      <span class="avatar"><img src="imagens/amauri_jr.jpg" alt="Foto de Amauri Junior"></span>
      <span class="credit-txt"><small>Designed by</small><strong>Amauri Junior</strong></span>

<script>
/* =========================================================
   CONFIGURAÇÃO DAS NARRAÇÕES
   - src: caminho ou data URI do áudio. Enquanto estiver vazio,
     o app simula o áudio com "duracaoTeste" segundos para
     que os eventos possam ser testados.
   - eventos: lista de { tempo: segundos, acao: função(palco) }
     Os eventos são presos ao ÁUDIO, não ao relógio: cada um
     dispara quando o áudio passa pelo seu tempo, e pausar o áudio
     congela as animações que estiverem rodando no palco.
   ========================================================= */
const NARRACOES = [
  { id: "dialogo0", titulo: "Boas-vindas às Moléculas",       src: "audio/audio_moleculas_0.mp3", eventos: [] },
  { id: "dialogo1", titulo: "Átomos: as peças da fábrica",         src: "", duracaoTeste: 15, eventos: [] },
  { id: "dialogo2", titulo: "Ligações: como as peças se unem",     src: "", duracaoTeste: 15, eventos: [] },
  { id: "dialogo3", titulo: "Montando a primeira molécula",        src: "", duracaoTeste: 15, eventos: [] }
];

/* ---------- Palco: área onde os eventos aparecem ---------- */
const Palco = {
  el: document.getElementById("conteudoPalco"),
  pausado: false,
  limpar() { this.el.innerHTML = ""; },
  mostrar(html) { this.el.innerHTML = html; this.sincronizar(); },
  adicionar(html) { this.el.insertAdjacentHTML("beforeend", html); this.sincronizar(); },
  reiniciar() { this.limpar(); this.pausado = false; },
  // Animações (CSS ou Web Animations) do palco seguem o estado do áudio
  animacoes() { return this.el.getAnimations ? this.el.getAnimations({ subtree: true }) : []; },
  pausar() { this.pausado = true; this.animacoes().forEach(a => a.pause()); },
  retomar() { this.pausado = false; this.animacoes().forEach(a => { if (a.playState === "paused") a.play(); }); },
  sincronizar() { if (this.pausado) this.pausar(); }
};

/* ---------- Fonte de áudio (real ou simulada) ---------- */
function criarFonte(narracao) {
  if (narracao.src) {
    const a = new Audio(narracao.src);
    a.preload = "auto";
    a.addEventListener("loadedmetadata", () => ui.progresso(a.currentTime, a.duration));
    // pausa/retomada vinda de fora (fone, teclas de mídia, tela de bloqueio)
    a.addEventListener("pause", () => { if (!a.ended && Player.fonte === a) Player.pausar(); });
    a.addEventListener("play", () => { if (Player.fonte === a) Player.tocar(); });
    return a;
  }
  // Simulação: mesmo "formato" de um elemento <audio>
  let inicio = 0, acumulado = 0;
  return {
    duration: narracao.duracaoTeste || 10,
    paused: true,
    ended: false,
    get currentTime() {
      const t = this.paused ? acumulado : acumulado + (performance.now() - inicio) / 1000;
      return Math.min(t, this.duration);
    },
    set currentTime(v) { acumulado = v; inicio = performance.now(); },
    play() { this.ended = false; inicio = performance.now(); this.paused = false; return Promise.resolve(); },
    pause() { acumulado = this.currentTime; this.paused = true; }
  };
}

/* ---------- Player ---------- */
const Player = {
  indice: -1,
  fonte: null,
  disparados: new Set(),
  loop: null,

  carregar(i) {
    this.parar();
    this.indice = i;
    const n = NARRACOES[i];
    this.fonte = criarFonte(n);
    this.disparados = new Set();
    Palco.limpar();
    ui.nome.textContent = `${i + 1}. ${n.titulo}`;
    atualizarSumario();
  },

  tocar() {
    if (!this.fonte) return;
    if (this.fonte.paused) this.fonte.play().catch(() => { this.pausar(); });
    Palco.retomar();
    this.acompanhar();
    ui.atualizarBotao(true);
  },

  pausar() {
    if (!this.fonte) return;
    if (!this.fonte.paused) this.fonte.pause();
    Palco.pausar();
    cancelAnimationFrame(this.loop);
    ui.atualizarBotao(false);
  },

  parar() {
    const f = this.fonte;
    this.fonte = null;               // solta a fonte antes, para os eventos de "pause" dela serem ignorados
    if (f) { f.pause(); f.currentTime = 0; }
    cancelAnimationFrame(this.loop);
    ui.atualizarBotao(false);
  },

  irPara(i) {
    this.carregar(i);
    this.tocar();
  },

  acompanhar() {
    const passo = () => {
      const f = this.fonte;
      if (!f) return;
      const t = f.currentTime;
      const d = Number.isFinite(f.duration) ? f.duration : 0;
      ui.progresso(t, d);

      // Dispara eventos cujo tempo já passou
      NARRACOES[this.indice].eventos.forEach((ev, k) => {
        if (t >= ev.tempo && !this.disparados.has(k)) {
          this.disparados.add(k);
          try { ev.acao(Palco); } catch (e) { console.error(e); }
        }
      });

      const acabou = f.ended || (d && t >= d);
      if (acabou) { this.aoTerminar(); return; }
      if (!f.paused) this.loop = requestAnimationFrame(passo);
    };
    cancelAnimationFrame(this.loop);
    this.loop = requestAnimationFrame(passo);
  },

  aoTerminar() {
    if (this.fonte && !this.fonte.src) { this.fonte.paused = true; this.fonte.ended = true; }
    ui.atualizarBotao(false);
    this.terminou = true;
    ui.playNoCanto();
  },

  // Botão play: 1º clique (play grande) = dialogo0; depois alterna pausa;
  // ao fim de uma narração, o próximo clique toca a seguinte.
  cliquePlay() {
    if (ui.btnPlay.classList.contains("central")) { ui.esconderPlayCentral(); this.tocar(); return; }
    if (this.indice === -1) { this.irPara(0); return; }
    if (this.terminou) {
      this.terminou = false;
      const prox = this.indice + 1 < NARRACOES.length ? this.indice + 1 : this.indice;
      this.irPara(prox);
      return;
    }
    this.fonte.paused ? this.tocar() : this.pausar();
  },

  resetarTudo() {
    this.parar();
    this.indice = -1;
    this.fonte = null;
    this.terminou = false;
    Palco.reiniciar();
    ui.progresso(0, 0);
    atualizarSumario();
  }
};

/* ---------- Interface ---------- */
const ICONE_PLAY  = '<path d="M7 4.5v15l12-7.5z"/>';
const ICONE_PAUSE = '<rect x="6" y="4.5" width="4.2" height="15" rx="1"/><rect x="13.8" y="4.5" width="4.2" height="15" rx="1"/>';

const ui = {
  nome: document.getElementById("nomeFaixa"),
  barra: document.getElementById("barraProgresso"),
  tempo: document.getElementById("tempoFaixa"),
  btnPlay: document.getElementById("btnPlay"),
  icone: document.getElementById("iconePlay"),
  atualizarBotao(tocando) {
    this.icone.innerHTML = tocando ? ICONE_PAUSE : ICONE_PLAY;
    this.btnPlay.classList.toggle("tocando", tocando);
    this.btnPlay.setAttribute("aria-label", tocando ? "Pausar narração" : "Tocar narração");
  },
  progresso(t, d) {
    const fmt = s => { s = Math.floor(s || 0); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
    this.barra.style.width = d ? `${(t / d) * 100}%` : "0%";
    this.tempo.textContent = `${fmt(t)} / ${fmt(d)}`;
  },

  // Play grande no centro do palco, só na abertura da página
  playCentral() {
    const palco = document.getElementById("palco");
    pagina1.style.setProperty("--play-x", `${palco.offsetLeft + palco.offsetWidth / 2}px`);
    pagina1.style.setProperty("--play-y", `${palco.offsetTop + palco.offsetHeight / 2}px`);
    this.btnPlay.classList.remove("oculto");
    this.btnPlay.classList.add("central");
    pagina1.classList.add("abertura");
  },
  // 1º toque: o play some (e a faixa de informações aparece)
  esconderPlayCentral() {
    this.btnPlay.classList.remove("central");
    this.btnPlay.classList.add("oculto");
    pagina1.classList.remove("abertura");
  },
  // Fim da narração (ou navegação rápida): o play reaparece no canto, em fade
  playNoCanto() {
    this.btnPlay.classList.remove("central", "oculto");
    pagina1.classList.remove("abertura");
  }
};
window.addEventListener("resize", () => { if (ui.btnPlay.classList.contains("central")) ui.playCentral(); });

/* ---------- Navegação entre telas ---------- */
const capa = document.getElementById("capa");
const pagina1 = document.getElementById("pagina1");

const semMovimento = matchMedia("(prefers-reduced-motion: reduce)");

// O que cada tela faz ao aparecer
function aoEntrar(tela) {
  if (tela === capa) { capa.classList.remove("play"); void capa.offsetWidth; capa.classList.add("play"); }
  if (tela === pagina1) { Player.carregar(0); ui.playCentral(); }
}

// Troca de tela girando um cubo: ida gira para a esquerda, volta para a direita
function mostrarTela(tela) {
  const atual = document.querySelector(".tela.ativa");
  if (!atual || atual === tela || semMovimento.matches) {
    [capa, pagina1].forEach(t => t.classList.toggle("ativa", t === tela));
    aoEntrar(tela);
    return;
  }
  const volta = tela === capa;
  const sai = volta ? "cubo-sai-volta" : "cubo-sai";
  const entra = volta ? "cubo-entra-volta" : "cubo-entra";
  document.body.classList.add("girando");
  tela.classList.add("ativa", entra);
  atual.classList.add(sai);
  aoEntrar(tela);
  tela.addEventListener("animationend", function fim(e) {
    if (e.target !== tela) return;          // ignora animações dos filhos
    tela.removeEventListener("animationend", fim);
    atual.classList.remove("ativa", sai);
    tela.classList.remove(entra);
    document.body.classList.remove("girando");
    if (tela === pagina1) ui.playCentral();  // recalcula o centro sem a rotação
  });
}

document.getElementById("btnIniciar").addEventListener("click", () => mostrarTela(pagina1));
document.getElementById("btnHome").addEventListener("click", () => {
  fecharGaveta();
  Player.resetarTudo();
  mostrarTela(capa);
});
ui.btnPlay.addEventListener("click", () => Player.cliquePlay());

/* ---------- Navegação rápida (sumário) ---------- */
const gaveta = document.getElementById("gaveta");
const veu = document.getElementById("veu");
const sumario = document.getElementById("sumario");

function montarSumario() {
  sumario.innerHTML = NARRACOES.map((n, i) => `
    <li>
      <button class="item-sumario" data-indice="${i}">
        <span class="num">${i + 1}</span>
        <span class="item-texto">${n.titulo}</span>
      </button>
    </li>`).join("");
}
function atualizarSumario() {
  sumario.querySelectorAll(".item-sumario").forEach(b => {
    const atual = Number(b.dataset.indice) === Player.indice;
    b.classList.toggle("atual", atual);
    b.setAttribute("aria-current", atual ? "true" : "false");
  });
}
function abrirGaveta() {
  gaveta.classList.add("aberta"); veu.classList.add("aberto");
  gaveta.setAttribute("aria-hidden", "false");
  document.getElementById("btnFechar").focus();
}
function fecharGaveta() {
  gaveta.classList.remove("aberta"); veu.classList.remove("aberto");
  gaveta.setAttribute("aria-hidden", "true");
}

document.getElementById("btnNavRapida").addEventListener("click", abrirGaveta);
document.getElementById("btnFechar").addEventListener("click", fecharGaveta);
veu.addEventListener("click", fecharGaveta);
sumario.addEventListener("click", e => {
  const b = e.target.closest(".item-sumario");
  if (!b) return;
  fecharGaveta();
  Player.terminou = false;
  ui.playNoCanto();
  Player.irPara(Number(b.dataset.indice));
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") fecharGaveta();
  if (e.code === "Space" && pagina1.classList.contains("ativa") && !gaveta.classList.contains("aberta")
      && document.activeElement.tagName !== "BUTTON") {
    e.preventDefault(); Player.cliquePlay();
  }
});

montarSumario();
mostrarTela(capa);

/* ---------- PWA: instala o service worker (só quando servido por http/https) ---------- */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
